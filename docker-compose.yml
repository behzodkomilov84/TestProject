services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: test_project
    ports:
      - "3306:3306" # IntelliJ'dan (kontaynerdan tashqarida) ulanish uchun — faqat local dev
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # Yuklangan rasm/video fayllarni virus/zararli koddan tekshiradi
  # (FileStorageService shu konteynerga ulanadi). Birinchi marta ishga
  # tushganda virus bazasini (freshclam) yuklab olgani uchun bir necha
  # daqiqa vaqt olishi mumkin — keyingi ishga tushishlarda tez.
  clamav:
    image: clamav/clamav:1.4
    container_name: clamav
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  app:
    build: .
    container_name: spring-app
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_project?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN env var kiritilishi shart (.env fayliga qarang)}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-study_grow_bot}
      UPLOAD_DIR: /app/uploads
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # Parolni tiklash — email kanali (ixtiyoriy, Telegram ustuvor kanal).
      # Standart: Brevo (smtp-relay.brevo.com) — .env'ga qarang.
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@smart-test.local}
      # Payme/Click (ixtiyoriy — .env'da bo'lmasa, PaymeService/ClickService
      # "sozlanmagan" holatda ishlaydi, to'lov bloki frontend'da yashiriladi).
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_CHECKOUT_BASE_URL: ${PAYME_CHECKOUT_BASE_URL:-https://checkout.paycom.uz}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      CLICK_PAY_BASE_URL: ${CLICK_PAY_BASE_URL:-https://my.click.uz/services/pay}
      PAYMENT_PRICE_PER_MONTH_SOM: ${PAYMENT_PRICE_PER_MONTH_SOM:-50000}
      # Markazlashtirilgan xato kuzatuvi (Sentry, ixtiyoriy — .env'da
      # bo'lmasa, SentryAppender jim o'zini o'chiradi).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - uploads-data:/app/uploads # Savol/javob rasmlari konteyner qayta ishga tushganda ham saqlanib qolishi uchun
    restart: unless-stopped

volumes:
  mysql-data:
  uploads-data:
  clamav-data: