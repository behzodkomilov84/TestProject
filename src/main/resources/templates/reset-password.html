<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yangi parol o'rnatish</title>

    <link rel="stylesheet" href="/css/register-login.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>

<!-- th:utext — infoMessage endi <a>/<b> teglari bilan kelishi mumkin
     (masalan Telegram bot havolasi, PasswordResetService#requestReset) —
     BUTUNLAY server tomonidan qurilgan, foydalanuvchi kiritmasi emas,
     shu sabab xavfsiz (foydalanuvchi so'rovi, 2026-09-09). -->
<div id="success-alert"
     th:if="${infoMessage}"
     th:utext="${infoMessage}"
     class="success-alert"></div>

<p style="color: red"
   th:if="${resetPasswordError}"
   th:text="${resetPasswordError}"
   class="error-alert"
   id="error-alert"></p>

<div class="container">
    <div class="registration form">
        <header>Yangi parol o'rnatish</header>

        <form action="/reset-password" method="post">
            <input type="text" name="username" th:value="${param.username}" placeholder="Username" autocomplete="username" required>
            <input type="text" name="code" placeholder="Tasdiqlash kodi (6 xonali)" autocomplete="one-time-code" required maxlength="10">
            <input type="password" name="newPassword" placeholder="Yangi parol" autocomplete="new-password" required>
            <input type="password" name="confirmPassword" placeholder="Yangi parolni tasdiqlang" autocomplete="new-password" required>

            <input type="submit" class="button" value="Parolni yangilash">
        </form>

        <div class="signup">
            <span class="signup"><a href="/forgot-password">Kodni qayta yuborish</a></span>
        </div>
    </div>
</div>

<script>
    setTimeout(() => {
        const alert = document.getElementById("error-alert");
        if (alert) alert.style.display = "none";
    }, 8000);
</script>
</body>
</html>
