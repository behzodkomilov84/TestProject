<h1>Yo'nalishlar</h1>

<div class="wrapper">
    <button onclick="openCreateFieldForm()">+ Yangi Yo'nalish</button>

            <button onclick="submitCreateField()">✅ Yaratish</button>
            <button onclick="closeCreateFieldForm()">Bekor qilish</button>
        </div>
    </div>
