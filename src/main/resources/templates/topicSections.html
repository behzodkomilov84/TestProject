<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <title>Bo'limlar</title>

    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/science.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/topicSection.js" defer></script>

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Bo'limlar<span id="sectionsSummary" class="topics-summary"></span></h1>
<input type="hidden" id="scienceId" th:value="${scienceId}">
<div class="wrapper">
    <button onclick="location.href='/topics?scienceId=' + getScienceId()">📋 Barcha mavzular (bo'limsiz ko'rish)</button>
    <!-- Shu Fandagi hech qanday mavzuga biriktirilmagan (bo'sh) BARCHA
         bo'limlarni bir yo'la o'chiradi (deleteEmptySections, topicSection.js). -->
    <button onclick="deleteEmptySections()">🗑️ Bo'sh bo'limlarni o'chirish</button>
    <!-- Soft-delete qilingan (🗑️ o'chirilgan) Bo'limlar — "♻️ Tiklash"
         bilan bir zumda qaytariladi (TopicSectionService.getDeletedSections/restoreSection). -->
    <button onclick="toggleSectionTrash()">🗑️ O'chirilgan bo'limlar <span id="sectionTrashBadge" class="notif-badge" style="display:none;">0</span></button>

    <div id="sectionTrashPanel" style="display:none;">
        <div id="sectionTrashList"></div>
    </div>

    <div class="sort-buttons">
        <span>Saralash:</span>
        <button onclick="sortAllAZ('AZ')">A→Z</button>
        <button onclick="sortAllAZ('ZA')">Z→A</button>
    </div>

    <div class="error" id="error"></div>

    <div class="list" id="list"></div>

    <div class="fixed-bar">
        <div>
            <button onclick="add()">➕ Add</button>
            <button id="btnBack">🔙 Back</button>
        </div>

        <button onclick="saveToDb()">💾 Save to DB</button>
    </div>
</div>

<!-- "📝 Word'ga eksport" oynasi — ichida "🎲 Variantlar yaratish" checkbox'i
     (galochka qo'yilmasa oddiy bitta faylli eksport, qo'yilsa har biri
     boshqa savollardan iborat bir nechta variant + javoblar kaliti, ZIP
     holida — topicSection.js#confirmWordExport). -->
<div id="wordExportModal" class="modal-overlay">
    <div class="word-export-modal">
        <h2 class="modal-h2">📝 Word'ga eksport</h2>

        <label class="word-export-checkbox-row">
            <input type="checkbox" id="wordExportVariantsCheckbox" onchange="toggleWordExportVariantFields()">
            🎲 Variantlar yaratish (har bir talaba uchun boshqa-boshqa variant)
        </label>

        <div id="wordExportVariantFields" class="word-export-variant-fields hidden">
            <label>
                Nechta variant (talabalar soni)
                <input type="number" id="wordExportVariantCount" min="1" value="30">
            </label>
            <label>
                Har bir variantga nechta savol
                <input type="number" id="wordExportPerVariant" min="1" value="50">
            </label>
            <label class="word-export-checkbox-row">
                <input type="checkbox" id="wordExportShuffleAnswers" checked>
                Javob variantlari (A,B,C,D,E) tartibi ham aralashtirilsin
            </label>
            <p class="word-export-hint">
                Savollar shu bo'limdagi BARCHA mavzular bo'yicha TENG
                taqsimlanadi (mavzuda savol yetmasa, qolgan qismi boshqa
                mavzularga teng bo'lib beriladi). Natija — har biri alohida
                .docx fayl bo'lgan ZIP arxiv + javoblar kaliti (Excel).
            </p>
        </div>

        <div class="modal-footer">
            <button type="button" onclick="closeWordExportModal()">Bekor qilish</button>
            <button type="button" id="wordExportConfirmBtn" class="export-excel-btn" onclick="confirmWordExport()">Eksport qilish</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>
</body>
</html>
