<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <title>Mavzular</title>

    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/science.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/topicSection.js" defer></script>

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Bo'limlar sahifasidagi (science.html) "← Yo'nalishlar / <nomi>"
     breadcrumb'i bilan BIR XIL ko'rinish — qaysi Bo'lim ichida ekanini
     ko'rsatadi (foydalanuvchi so'rovi, 2026-09-05: "iyerarxiyaning boshqa
     qismlariga ham qo'sh"), topicSection.js#applyScopeBar to'ldiradi. -->
<div id="sectionScopeBar" class="field-scope-bar hidden">
    <a href="#" id="sectionScopeBackLink" class="field-scope-back">← Bo'limlar</a>
    <span id="sectionScopeName" class="field-scope-name"></span>
</div>

<!-- Bo'limlar sahifasi (science.html) bilan BIR XIL sarlavha qatori —
     nomi, soni va "+ Yangi mavzu" bitta gorizontal qatorda (foydalanuvchi
     so'rovi, 2026-09-05: "topicSection va topic sahifalarida ham shu
     ko'rinishni qo'lla"). Pastdagi "➕ Add" tugmasi shu sabab OLIB
     TASHLANDI. -->
<div class="page-title-row">
    <h1>Mavzular</h1>
    <div class="page-title-actions">
        <span class="chapter-box-count" id="sectionsSummary"></span>
        <button class="add-primary-btn" onclick="add()">➕ Yangi mavzu</button>
    </div>
</div>
<input type="hidden" id="scienceId" th:value="${scienceId}">
<div class="wrapper">
    <button onclick="location.href='/topics?scienceId=' + getScienceId() + fieldQuery">📋 Barcha darslar (mavzusiz ko'rish)</button>
    <!-- Shu Bo'limdagi hech qanday darsga biriktirilmagan (bo'sh) BARCHA
         mavzularni bir yo'la o'chiradi (deleteEmptySections, topicSection.js). -->
    <button onclick="deleteEmptySections()">🗑️ Bo'sh mavzularni o'chirish</button>
    <!-- Soft-delete qilingan (🗑️ o'chirilgan) Mavzular — "♻️ Tiklash"
         bilan bir zumda qaytariladi (TopicSectionService.getDeletedSections/restoreSection). -->
    <button onclick="toggleSectionTrash()">🗑️ O'chirilgan mavzular <span id="sectionTrashBadge" class="notif-badge" style="display:none;">0</span></button>

    <div id="sectionTrashPanel" style="display:none;">
        <div id="sectionTrashList"></div>
    </div>

    <div class="sort-buttons">
        <span>Saralash:</span>
        <button onclick="sortAllAZ('AZ')">A→Z</button>
        <button onclick="sortAllAZ('ZA')">Z→A</button>
    </div>

    <div class="error" id="error"></div>

    <div class="list" id="list"></div>

    <!-- "➕ Add" va "💾 Save to DB" olib tashlandi (foydalanuvchi so'rovi,
         2026-09-05): yangi mavzu qo'shish endi yuqoridagi sarlavha
         qatoridagi "+ Yangi mavzu" tugmasi orqali, o'zgarishlar esa
         DARHOL bazaga yoziladi. -->
    <div class="fixed-bar">
        <div>
            <button id="btnBack">🔙 Back</button>
        </div>
    </div>
</div>

<!-- "📝 Word'ga eksport" oynasi — ichida "🎲 Variantlar yaratish" checkbox'i
     (galochka qo'yilmasa oddiy bitta faylli eksport, qo'yilsa har biri
     boshqa savollardan iborat bir nechta variant + javoblar kaliti, ZIP
     holida — topicSection.js#confirmWordExport). -->
<div id="wordExportModal" class="modal-overlay">
    <div class="word-export-modal">
        <h2 class="modal-h2">📝 Word'ga eksport</h2>

        <label class="word-export-checkbox-row">
            <input type="checkbox" id="wordExportVariantsCheckbox" onchange="toggleWordExportVariantFields()">
            🎲 Variantlar yaratish (har bir talaba uchun boshqa-boshqa variant)
        </label>

        <div id="wordExportVariantFields" class="word-export-variant-fields hidden">
            <label>
                Nechta variant (talabalar soni)
                <input type="number" id="wordExportVariantCount" min="1" value="30">
            </label>
            <label>
                Har bir variantga nechta savol
                <input type="number" id="wordExportPerVariant" min="1" value="50">
            </label>

            <div class="word-export-mode-group">
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="different" checked onchange="updateWordExportHint()">
                    🔀 Har biriga boshqa-boshqa savollar
                </label>
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="same" onchange="updateWordExportHint()">
                    🎯 Barchasiga bir xil savollar (faqat tartibi aralashtiriladi)
                </label>
            </div>

            <label class="word-export-checkbox-row">
                <input type="checkbox" id="wordExportShuffleAnswers" checked>
                Javob variantlari (A,B,C,D,E) tartibi ham aralashtirilsin
            </label>
            <p class="word-export-hint" id="wordExportHint">
                Savollar shu mavzudagi BARCHA darslar bo'yicha TENG
                taqsimlanadi (darsda savol yetmasa, qolgan qismi boshqa
                darslarga teng bo'lib beriladi). Natija — har biri alohida
                .docx fayl bo'lgan ZIP arxiv + javoblar kaliti (Excel).
            </p>
        </div>

        <div class="modal-footer">
            <button type="button" onclick="closeWordExportModal()">Bekor qilish</button>
            <button type="button" id="wordExportConfirmBtn" class="export-excel-btn" onclick="confirmWordExport()">Eksport qilish</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>
</body>
</html>
