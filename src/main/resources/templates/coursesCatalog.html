<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kurslar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/courses.css">

    <script src="/js/courses.js" defer></script>
    <script src="/js/navbar.js" defer></script>
</head>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="courses-container">
    <header class="courses-top-bar">
        <h1>🎓 Kurslar</h1>
        <div>
            <!-- "Yo'nalish" (soha) — Kurslar (Bo'limlar) katalogini
                 kattaroq guruhga bo'ladi, turli sohalarga tegishli kurslar
                 aralashib ketmasin deb (foydalanuvchi so'rovi, 2026-09-04). -->
            <button id="createFieldBtn" class="owner-only-el" style="display:none;" onclick="submitCreateField()">+ Yangi Yo'nalish</button>
            <!-- "+ Yangi kurs" olib tashlandi (foydalanuvchi so'rovi,
                 2026-09-05) — endi har bir Yo'nalish qutisining o'z ➕
                 tugmasi orqali (renderFieldBox, courses.js). -->
            <!-- Faqat OWNER/ADMIN uchun — soft-delete qilingan kurslarni
                 ko'rish/tiklash (courseTrash.html). -->
            <button id="trashBtn" class="owner-only-el" style="display:none;" onclick="location.href='/courses/trash'">🗑️ O'chirilganlar <span id="courseTrashBadge" class="notif-badge" style="display:none;">0</span></button>
        </div>
    </header>

    <!-- OWNER/ADMIN uchun — yangi kurs (Bo'lim) yaratish formasi — endi
         MODAL (overlay) sifatida, "✏️ Tahrirlash" (editCourseForm,
         courseDetail.html) bilan bir xil andoza (foydalanuvchi so'rovi,
         2026-09-05: "Kurslar sahifasida ham shu modal css'ini tekshirib
         chiq" — ilgari oddiy display:none/flex bilan sahifa ICHIDA
         ochilardi, haqiqiy markazlashtirilgan modal emas edi). -->
    <div id="createCourseForm" class="modal-overlay">
    <div class="course-form course-form-modal">
        <input type="text" id="newCourseTitle" placeholder="Kurs nomi">
        <textarea id="newCourseDescription" placeholder="Kurs tavsifi" rows="3"></textarea>
        <!-- Majburiy — CourseService.createCourse Yo'nalishsiz kurs
             yaratishga ruxsat bermaydi (foydalanuvchi so'rovi, 2026-09-04). -->
        <select id="newCourseField"></select>
        <label class="content-toggle-label">
            <input type="checkbox" id="newCourseFree" onchange="onNewCourseFreeToggle()"> 🆓 Bepul kurs (obunasiz ham hammaga ochiq — botda ham)
        </label>
        <div id="newCoursePriceField">
            <input type="number" id="newCoursePrice" placeholder="Kurs narxi (so'm)" min="0" step="1000">
        </div>
        <div class="course-form-cover">
            <input type="file" id="newCourseCoverFile" accept="image/*">
            <span id="newCourseCoverStatus"></span>
        </div>
        <div class="course-form-actions">
            <button onclick="submitCreateCourse()">✅ Yaratish</button>
            <button onclick="closeCreateCourseForm()">Bekor qilish</button>
        </div>
    </div>
    </div>

    <!-- Endi Yo'nalish "box"lari (chapter-box uslubi bilan bir xil —
         courses.js#renderFieldBox), har biri ICHIDA o'zining kurslari
         (.courses-grid). -->
    <div id="coursesGrid" class="sections-list">
        <div class="courses-empty">Yuklanmoqda...</div>
    </div>
</div>

</body>
</html>
