<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kurs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/courses.css">

    <script th:inline="javascript">
        const COURSE_ID = /*[[${courseId}]]*/ 0;
    </script>
    <!-- .docx faylni HTML'ga aylantirish uchun (formatlash — abzatslar,
         qalin/kursiv, sarlavhalar, ro'yxatlar — saqlangan holda), bo'lim
         matnini fayldan import qilishda ishlatiladi. -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
    <script src="/js/courseDetail.js" defer></script>
    <script src="/js/navbar.js" defer></script>
</head>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="courses-container">
    <header class="courses-top-bar">
        <h1 id="courseTitle">Yuklanmoqda...</h1>
        <button class="back-btn" onclick="location.href='/courses'">← Kurslar</button>
    </header>

    <p id="courseDescription" class="course-description"></p>

    <div id="subscribeBanner" class="subscribe-banner" style="display:none;">
        <div id="subscribeBannerText">🔒 Bu kursning to'liq mazmuniga kirish uchun obuna kerak.</div>
        <div class="subscribe-banner-actions">
            <button id="payWithClickBtn" onclick="payWithClick()" style="display:none;">💳 Click orqali to'lash</button>
            <button id="requestSubscriptionBtn" onclick="requestSubscription()">📩 Obunaga so'rov yuborish</button>
        </div>
    </div>

    <!-- OWNER uchun — kursni boshqarish paneli -->
    <div id="manageCoursePanel" class="course-manage-panel owner-only-el" style="display:none;">
        <h2>⚙️ Kursni boshqarish</h2>

        <div class="manage-actions-row">
            <button onclick="togglePublish()" id="togglePublishBtn">—</button>
            <button onclick="openEditCourseForm()">✏️ Kursni tahrirlash</button>
            <button class="danger-btn" onclick="deleteCourse()">🗑️ Kursni o'chirish</button>
        </div>

        <div id="editCourseForm" class="course-form" style="display:none;">
            <input type="text" id="editCourseTitle" placeholder="Kurs nomi">
            <textarea id="editCourseDescription" placeholder="Kurs tavsifi" rows="3"></textarea>
            <label class="content-toggle-label">
                <input type="checkbox" id="editCourseFree" onchange="onEditCourseFreeToggle()"> 🆓 Bepul kurs (obunasiz ham hammaga ochiq — botda ham)
            </label>
            <div id="editCoursePriceField">
                <input type="number" id="editCoursePrice" placeholder="Kurs narxi (so'm)" min="0" step="1000">
            </div>
            <div class="course-form-cover">
                <img id="editCourseCoverPreview" class="course-cover-preview" style="display:none;" alt="Kurs rasmi">
                <input type="file" id="editCourseCoverFile" accept="image/*" onchange="previewEditCourseCover(this)">
                <span id="editCourseCoverStatus"></span>
            </div>
            <div class="course-form-actions">
                <button onclick="submitEditCourse()">✅ Saqlash</button>
                <button onclick="closeEditCourseForm()">Bekor qilish</button>
            </div>
        </div>

        <button id="openAddSectionBtn" onclick="openAddSectionForm()">➕ Yangi bo'lim qo'shish</button>

        <div id="addSectionForm" class="section-form" style="display:none;">
            <input type="text" id="newSectionTitle" placeholder="Bo'lim nomi" maxlength="500" oninput="onSectionTitleInput('new')">

            <!-- Matn va video bir vaqtning o'zida ham qo'shilishi mumkin —
                 kamida bittasi belgilangan bo'lishi shart. -->
            <label class="content-toggle-label">
                <input type="checkbox" id="includeText" checked onchange="onContentToggle(this)"> 📄 Matn qo'shish
            </label>
            <div id="textFields">
                <div class="rich-toolbar">
                    <button type="button" onclick="richExec('newSectionTextEditor','bold')" title="Qalin (Ctrl+B)"><b>B</b></button>
                    <button type="button" onclick="richExec('newSectionTextEditor','italic')" title="Kursiv (Ctrl+I)"><i>I</i></button>
                    <button type="button" onclick="richExec('newSectionTextEditor','underline')" title="Tagi chizilgan (Ctrl+U)"><u>U</u></button>
                    <button type="button" onclick="richExec('newSectionTextEditor','strikeThrough')" title="Chizib o'tilgan"><s>S</s></button>
                    <span class="rich-toolbar-sep"></span>
                    <select class="rich-toolbar-select" title="Shrift turi" onmousedown="saveRichSelection('newSectionTextEditor')" onchange="richFontName('newSectionTextEditor', this.value); this.selectedIndex=0;">
                        <option value="" selected disabled>🔤 Shrift</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                    <select class="rich-toolbar-select" title="Shrift o'lchami" onmousedown="saveRichSelection('newSectionTextEditor')" onchange="richFontSize('newSectionTextEditor', this.value); this.selectedIndex=0;">
                        <option value="" selected disabled>🔠 O'lcham</option>
                        <option value="12">12</option>
                        <option value="14">14</option>
                        <option value="16">16</option>
                        <option value="18">18</option>
                        <option value="20">20</option>
                        <option value="24">24</option>
                        <option value="28">28</option>
                        <option value="32">32</option>
                    </select>
                    <span class="rich-toolbar-sep"></span>
                    <input type="color" class="rich-toolbar-color" title="🎨 Harf rangi" value="#000000" onmousedown="saveRichSelection('newSectionTextEditor')" onchange="richForeColor('newSectionTextEditor', this.value)">
                    <input type="color" class="rich-toolbar-color" title="🖊️ Fon (bo'yash) rangi" value="#fff59d" onmousedown="saveRichSelection('newSectionTextEditor')" onchange="richHiliteColor('newSectionTextEditor', this.value)">
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('newSectionTextEditor','justifyLeft')" title="Chapga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="0" y="5" width="10" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="0" y="13" width="10" height="2"/></svg></button>
                    <button type="button" onclick="richExec('newSectionTextEditor','justifyCenter')" title="Markazga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="3" y="5" width="10" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="3" y="13" width="10" height="2"/></svg></button>
                    <button type="button" onclick="richExec('newSectionTextEditor','justifyRight')" title="O'ngga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="6" y="5" width="10" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="6" y="13" width="10" height="2"/></svg></button>
                    <button type="button" onclick="richExec('newSectionTextEditor','justifyFull')" title="Ikki tomonga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="0" y="5" width="16" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="0" y="13" width="16" height="2"/></svg></button>
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('newSectionTextEditor','outdent')" title="Chekinishni kamaytirish"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="7" y="1" width="9" height="2"/><rect x="7" y="7" width="9" height="2"/><rect x="7" y="13" width="9" height="2"/><path d="M5 4 L1 8 L5 12 Z"/></svg></button>
                    <button type="button" onclick="richExec('newSectionTextEditor','indent')" title="Chekinishni oshirish"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="7" y="1" width="9" height="2"/><rect x="7" y="7" width="9" height="2"/><rect x="7" y="13" width="9" height="2"/><path d="M1 4 L5 8 L1 12 Z"/></svg></button>
                    <select class="rich-toolbar-select" title="Qator oralig'i" onmousedown="saveRichSelection('newSectionTextEditor')" onchange="richLineSpacing('newSectionTextEditor', this.value); this.selectedIndex=0;">
                        <option value="" selected disabled>↕️ Oraliq</option>
                        <option value="1">1.0</option>
                        <option value="1.15">1.15</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2.0</option>
                    </select>
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('newSectionTextEditor','insertUnorderedList')" title="Ro'yxat">☰•</button>
                    <button type="button" onclick="richExec('newSectionTextEditor','insertOrderedList')" title="Raqamlangan ro'yxat">☰1</button>
                    <button type="button" onclick="document.getElementById('newSectionImageInput').click()" title="Rasm qo'shish">🖼</button>
                    <input type="file" id="newSectionImageInput" accept="image/*" style="display:none;" onchange="richInsertImage('newSectionTextEditor', this)">
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('newSectionTextEditor','removeFormat')" title="Formatni tozalash">🧹</button>
                </div>
                <div id="newSectionTextEditor" class="rich-text-editor" contenteditable="true"
                     data-placeholder="Matn kontenti — yozing yoki PDF/Word'dan joylashtiring (formatlash saqlanadi)"></div>
                <div class="import-file-row">
                    <label for="newSectionImportFile">📁 yoki .docx faylni import qilish:</label>
                    <input type="file" id="newSectionImportFile" accept=".docx" onchange="importDocxFile(this, 'newSectionTextEditor')">
                </div>
            </div>

            <label class="content-toggle-label">
                <input type="checkbox" id="includeVideo" onchange="onContentToggle(this)"> 🎬 Video qo'shish
            </label>
            <div id="videoFields" style="display:none;">
                <select id="newSectionVideoSource" onchange="onVideoSourceChange()">
                    <option value="YOUTUBE">YouTube</option>
                    <option value="UPLOAD">Fayl yuklash</option>
                    <option value="EXTERNAL">Boshqa manba (link)</option>
                </select>
                <input type="text" id="newSectionVideoUrl" placeholder="YouTube video ID (masalan: dQw4w9WgXcQ)">
                <input type="file" id="newSectionVideoFile" accept="video/*" style="display:none;">
                <input type="number" id="newSectionVideoDuration" placeholder="Video davomiyligi (soniya) — faqat 'Boshqa manba' uchun" style="display:none;">
            </div>

            <!-- Mavzuni TEST BOSHQARUVI'dagi Fan/Mavzu bilan bog'lash — ixtiyoriy.
                 Kiritilgan nom mavjud bo'lmasa, avtomatik yaratiladi. Fan —
                 tanlov (default — shu kurs nomi), "Boshqa" tanlansa erkin
                 nom kiritish maydoni chiqadi. Mavzu nomi — default sifatida
                 bo'lim nomi bilan bir xil (bo'lim nomi o'zgarsa, u ham
                 qo'lda tahrirlanmagan bo'lsa, avtomatik yangilanadi).
            -->
            <label class="content-toggle-label">🎯 Mavzuga oid testlar bilan bog'lash (ixtiyoriy)</label>
            <select id="newSectionScienceSelect" onchange="onScienceSelectChange('new')"></select>
            <input type="text" id="newSectionScienceOther" placeholder="Fan nomi" style="display:none;">
            <div class="field-hint">Masalan: Kimyo</div>
            <input type="text" id="newSectionTopicName" placeholder="Mavzu nomi" oninput="onTopicNameInput('new')">
            <div class="field-hint">Mavjud bo'lmasa, avtomatik yaratiladi</div>

            <div class="course-form-actions">
                <button onclick="submitAddSection()">✅ Bo'limni qo'shish</button>
                <button onclick="closeAddSectionForm()">Bekor qilish</button>
            </div>
        </div>

        <!-- Bo'limni tahrirlash — "✏️" tugmasi bosilganda shu bitta forma
             tanlangan bo'lim ma'lumotlari bilan to'ldirilib ochiladi. -->
        <div id="editSectionForm" class="section-form" style="display:none;">
            <input type="text" id="editSectionTitle" placeholder="Bo'lim nomi" maxlength="500" oninput="onSectionTitleInput('edit')">

            <label class="content-toggle-label">
                <input type="checkbox" id="editIncludeText" onchange="onEditContentToggle(this)"> 📄 Matn qo'shish
            </label>
            <div id="editTextFields">
                <div class="rich-toolbar">
                    <button type="button" onclick="richExec('editSectionTextEditor','bold')" title="Qalin (Ctrl+B)"><b>B</b></button>
                    <button type="button" onclick="richExec('editSectionTextEditor','italic')" title="Kursiv (Ctrl+I)"><i>I</i></button>
                    <button type="button" onclick="richExec('editSectionTextEditor','underline')" title="Tagi chizilgan (Ctrl+U)"><u>U</u></button>
                    <button type="button" onclick="richExec('editSectionTextEditor','strikeThrough')" title="Chizib o'tilgan"><s>S</s></button>
                    <span class="rich-toolbar-sep"></span>
                    <select class="rich-toolbar-select" title="Shrift turi" onmousedown="saveRichSelection('editSectionTextEditor')" onchange="richFontName('editSectionTextEditor', this.value); this.selectedIndex=0;">
                        <option value="" selected disabled>🔤 Shrift</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                    <select class="rich-toolbar-select" title="Shrift o'lchami" onmousedown="saveRichSelection('editSectionTextEditor')" onchange="richFontSize('editSectionTextEditor', this.value); this.selectedIndex=0;">
                        <option value="" selected disabled>🔠 O'lcham</option>
                        <option value="12">12</option>
                        <option value="14">14</option>
                        <option value="16">16</option>
                        <option value="18">18</option>
                        <option value="20">20</option>
                        <option value="24">24</option>
                        <option value="28">28</option>
                        <option value="32">32</option>
                    </select>
                    <span class="rich-toolbar-sep"></span>
                    <input type="color" class="rich-toolbar-color" title="🎨 Harf rangi" value="#000000" onmousedown="saveRichSelection('editSectionTextEditor')" onchange="richForeColor('editSectionTextEditor', this.value)">
                    <input type="color" class="rich-toolbar-color" title="🖊️ Fon (bo'yash) rangi" value="#fff59d" onmousedown="saveRichSelection('editSectionTextEditor')" onchange="richHiliteColor('editSectionTextEditor', this.value)">
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('editSectionTextEditor','justifyLeft')" title="Chapga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="0" y="5" width="10" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="0" y="13" width="10" height="2"/></svg></button>
                    <button type="button" onclick="richExec('editSectionTextEditor','justifyCenter')" title="Markazga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="3" y="5" width="10" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="3" y="13" width="10" height="2"/></svg></button>
                    <button type="button" onclick="richExec('editSectionTextEditor','justifyRight')" title="O'ngga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="6" y="5" width="10" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="6" y="13" width="10" height="2"/></svg></button>
                    <button type="button" onclick="richExec('editSectionTextEditor','justifyFull')" title="Ikki tomonga tekislash"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="1" width="16" height="2"/><rect x="0" y="5" width="16" height="2"/><rect x="0" y="9" width="16" height="2"/><rect x="0" y="13" width="16" height="2"/></svg></button>
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('editSectionTextEditor','outdent')" title="Chekinishni kamaytirish"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="7" y="1" width="9" height="2"/><rect x="7" y="7" width="9" height="2"/><rect x="7" y="13" width="9" height="2"/><path d="M5 4 L1 8 L5 12 Z"/></svg></button>
                    <button type="button" onclick="richExec('editSectionTextEditor','indent')" title="Chekinishni oshirish"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="7" y="1" width="9" height="2"/><rect x="7" y="7" width="9" height="2"/><rect x="7" y="13" width="9" height="2"/><path d="M1 4 L5 8 L1 12 Z"/></svg></button>
                    <select class="rich-toolbar-select" title="Qator oralig'i" onmousedown="saveRichSelection('editSectionTextEditor')" onchange="richLineSpacing('editSectionTextEditor', this.value); this.selectedIndex=0;">
                        <option value="" selected disabled>↕️ Oraliq</option>
                        <option value="1">1.0</option>
                        <option value="1.15">1.15</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2.0</option>
                    </select>
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('editSectionTextEditor','insertUnorderedList')" title="Ro'yxat">☰•</button>
                    <button type="button" onclick="richExec('editSectionTextEditor','insertOrderedList')" title="Raqamlangan ro'yxat">☰1</button>
                    <button type="button" onclick="document.getElementById('editSectionImageInput').click()" title="Rasm qo'shish">🖼</button>
                    <input type="file" id="editSectionImageInput" accept="image/*" style="display:none;" onchange="richInsertImage('editSectionTextEditor', this)">
                    <span class="rich-toolbar-sep"></span>
                    <button type="button" onclick="richExec('editSectionTextEditor','removeFormat')" title="Formatni tozalash">🧹</button>
                </div>
                <div id="editSectionTextEditor" class="rich-text-editor" contenteditable="true"
                     data-placeholder="Matn kontenti — yozing yoki PDF/Word'dan joylashtiring (formatlash saqlanadi)"></div>
                <div class="import-file-row">
                    <label for="editSectionImportFile">📁 yoki .docx faylni import qilish:</label>
                    <input type="file" id="editSectionImportFile" accept=".docx" onchange="importDocxFile(this, 'editSectionTextEditor')">
                </div>
            </div>

            <label class="content-toggle-label">
                <input type="checkbox" id="editIncludeVideo" onchange="onEditContentToggle(this)"> 🎬 Video qo'shish
            </label>
            <div id="editVideoFields" style="display:none;">
                <select id="editSectionVideoSource" onchange="onEditVideoSourceChange()">
                    <option value="YOUTUBE">YouTube</option>
                    <option value="UPLOAD">Fayl yuklash</option>
                    <option value="EXTERNAL">Boshqa manba (link)</option>
                </select>
                <input type="text" id="editSectionVideoUrl" placeholder="YouTube video ID (masalan: dQw4w9WgXcQ)">
                <input type="file" id="editSectionVideoFile" accept="video/*" style="display:none;">
                <input type="number" id="editSectionVideoDuration" placeholder="Video davomiyligi (soniya) — faqat 'Boshqa manba' uchun" style="display:none;">
            </div>

            <label class="content-toggle-label">🎯 Mavzuga oid testlar bilan bog'lash (ixtiyoriy)</label>
            <select id="editSectionScienceSelect" onchange="onScienceSelectChange('edit')"></select>
            <input type="text" id="editSectionScienceOther" placeholder="Fan nomi" style="display:none;">
            <div class="field-hint">Masalan: Kimyo</div>
            <input type="text" id="editSectionTopicName" placeholder="Mavzu nomi" oninput="onTopicNameInput('edit')">
            <div class="field-hint">Mavjud bo'lmasa, avtomatik yaratiladi</div>

            <div class="course-form-actions">
                <button onclick="submitEditSection()">✅ Saqlash</button>
                <button onclick="closeEditSectionForm()">Bekor qilish</button>
            </div>
        </div>

        <!-- Obuna berish/tasdiqlash/bekor qilish — endi barcha kurslar uchun
             yagona "Kursga obuna berish" sahifasida (navbar > 🎓 Kurslar). -->
        <button id="manageSubscriptionsBtn" onclick="location.href='/courses/subscriptions?courseId=' + COURSE_ID">
            💳 Bu kurs uchun obunalarni boshqarish
        </button>
    </div>

    <h2 class="curriculum-title">📋 Mavzular</h2>

    <!-- OWNER/ADMIN uchun — bo'limlarni saralash. -->
    <div id="sectionsSortBar" class="sections-sort-bar" style="display:none;">
        <span>Saralash:</span>
        <button onclick="sortSections('AZ')">A→Z</button>
        <button onclick="sortSections('ZA')">Z→A</button>
    </div>

    <div id="sectionsList" class="sections-list">
        <div class="courses-empty">Yuklanmoqda...</div>
    </div>
</div>

</body>
</html>
