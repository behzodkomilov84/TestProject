<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>registration</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="/css/register-login.css">
    <link rel="stylesheet" href="/css/country-picker.css">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <script th:inline="javascript">
        const COUNTRIES = /*[[${countries}]]*/ [];
    </script>
    <script src="/js/country-picker.js" defer></script>
    <script defer>
        document.addEventListener("DOMContentLoaded", () => {
            initCountryPicker(
                document.getElementById("phoneCountryPicker"),
                COUNTRIES,
                "UZ",
                (iso) => { document.getElementById("phoneCountryHidden").value = iso; }
            );
        });
    </script>
</head>
<body>
<div class="container">
    <div class="registration form">
        <header>Sign up</header>

        <p style="color: red"
           th:if="${registrationError}"
           th:text="${registrationError}"
           class="error-alert"></p>

        <form action="/registration" method="post">
            <div class="form-row">
                <input type="text" name="username" placeholder="Enter your name" autocomplete="username" required>
                <input type="email" name="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="phone-field">
                <div id="phoneCountryPicker"></div>
                <input type="hidden" name="phoneCountry" id="phoneCountryHidden" value="UZ">
                <input type="tel" name="phoneNumber" placeholder="Telefon (ixtiyoriy)" autocomplete="tel">
            </div>

            <div class="form-row">
                <input type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                <input type="password" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
            </div>

            <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:normal;">
                <input type="checkbox" required style="width:auto;">
                <span>
                    <a href="/terms" target="_blank">Foydalanish shartlari</a> va
                    <a href="/privacy" target="_blank">Maxfiylik siyosati</a>ga roziman
                </span>
            </label>

            <input type="submit" class="button" value="Sign up">
        </form>
        <div class="signup">
            <span class="signup">Already have an account?
            <label><a href="/templates/login.html">Login</a> </label></span>
        </div>
    </div>
</div>

</body>
</html>
