<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Ro'yxatdan o'tish</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="/css/register-login.css">
    <link rel="stylesheet" href="/css/country-picker.css">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <script th:inline="javascript">
        const COUNTRIES = /*[[${countries}]]*/ [];
    </script>
    <script src="/js/country-picker.js" defer></script>
    <script defer>
        document.addEventListener("DOMContentLoaded", () => {
            initCountryPicker(
                document.getElementById("phoneCountryPicker"),
                COUNTRIES,
                "UZ",
                (iso) => { document.getElementById("phoneCountryHidden").value = iso; }
            );
        });
    </script>
</head>
<body>
<div class="container">
    <div class="registration form">
        <header>Ro'yxatdan o'tish</header>

        <p style="color: red"
           th:if="${registrationError}"
           th:text="${registrationError}"
           class="error-alert"></p>

        <form action="/registration" method="post">
            <div class="form-row">
                <input type="text" name="username" placeholder="Foydalanuvchi nomini kiriting" autocomplete="username" required>
                <!-- Email ENDI IXTIYORIY — "required" olib tashlandi. Ko'pchilik
                     foydalanuvchida email yo'q yoki o'zi login/parolini bilmaydi
                     (UserServiceImpl.register — bo'sh qoldirilsa, akkaunt
                     tasdiqlashsiz darhol faollashadi). -->
                <input type="email" name="email" placeholder="Email (ixtiyoriy)" autocomplete="email">
            </div>

            <!-- Ism/Familiya/Ish-o'qish joyi/Lavozim — MAJBURIY (foydalanuvchi
                 so'rovi, 2026-09-06: "Қайси сохадан, қайси касбдагилар
                 фойдаланаётганлигига қараб хулоса чиқарамиз"). -->
            <div class="form-row">
                <input type="text" name="firstName" placeholder="Ismingiz" autocomplete="given-name" required>
                <input type="text" name="lastName" placeholder="Familiyangiz" autocomplete="family-name" required>
            </div>

            <div class="form-row">
                <input type="text" name="workplace" placeholder="Ish yoki o'qish joyingiz" required>
                <input type="text" name="jobTitle" placeholder="Lavozimingiz (masalan: shifokor, talaba)" required>
            </div>

            <div class="phone-field">
                <div id="phoneCountryPicker"></div>
                <input type="hidden" name="phoneCountry" id="phoneCountryHidden" value="UZ">
                <input type="tel" name="phoneNumber" placeholder="Telefon (ixtiyoriy)" autocomplete="tel">
            </div>

            <div class="form-row">
                <input type="password" name="password" placeholder="Parol yarating" autocomplete="new-password" required>
                <input type="password" name="confirmPassword" placeholder="Parolni tasdiqlang" autocomplete="new-password" required>
            </div>

            <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:normal;">
                <input type="checkbox" required style="width:auto;">
                <span>
                    <a href="/terms" target="_blank">Foydalanish shartlari</a> va
                    <a href="/privacy" target="_blank">Maxfiylik siyosati</a>ga roziman
                </span>
            </label>

            <input type="submit" class="button" value="Ro'yxatdan o'tish">
        </form>

        <!-- "Telegram orqali kirish" — login.html'dagi bilan bir xil o'z
             tugmamiz + custom oauth flow (foydalanuvchi so'rovi,
             2026-09-06). Parol/username o'ylab topish shart emas, birinchi
             marta bosilganda akkaunt avtomatik yaratiladi
             (TelegramWidgetLoginService#createUser). -->
        <div class="social-divider"><span>yoki</span></div>
        <button type="button" class="telegram-login-btn" onclick="telegramLogin()">
            <svg width="20" height="20" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                <circle cx="120" cy="120" r="120" fill="#29b6f6"/>
                <path fill="#fff" d="M175.3 67.6L54.7 115c-8.3 3.3-8.2 7.8-1.5 9.8l30.8 9.6 71.4-44.9c3.4-2 6.5-.9 3.9 1.3l-57.8 52.2h-.1l2.1 30.9c3 0 4.3-1.4 6-3l14.4-14 30 22.2c5.5 3 9.5 1.5 10.9-5.1l19.7-92.9c2-8.1-3.1-11.7-8.2-9.5z"/>
            </svg>
            Telegram orqali kirish
        </button>
        <script src="https://telegram.org/js/telegram-widget.js?22"></script>
        <script th:inline="javascript">
            const TELEGRAM_BOT_ID = /*[[${telegramBotId}]]*/ "";

            function telegramLogin() {
                if (typeof Telegram === "undefined" || !Telegram.Login) {
                    alert("Telegram widget hali yuklanmadi, birozdan keyin qaytadan urinib ko'ring.");
                    return;
                }
                Telegram.Login.auth(
                    {bot_id: TELEGRAM_BOT_ID, request_access: "write"},
                    function (data) {
                        if (!data) return; // foydalanuvchi bekor qildi
                        window.location.href = "/telegram-login?" + new URLSearchParams(data).toString();
                    }
                );
            }
        </script>

        <!-- "Google orqali kirish" — login.html'dagi bilan bir xil. -->
        <a href="/oauth2/google/authorize" class="google-login-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
            </svg>
            Google orqali kirish
        </a>

        <div class="signup">
            <span class="signup">Hisobingiz bormi?
            <label><a href="/login">Kirish</a> </label></span>
        </div>
    </div>
</div>

</body>
</html>
