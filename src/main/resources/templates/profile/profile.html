<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/country-picker.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/country-picker.js" defer></script>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="profile-container">
    <div class="profile-container-up">
        <div class="profile-container-left" style="width:100%;">
            <h2 style="text-align: center">Profil</h2>
            <div id="user-info">
                <table border="1" class="table table-bordered">
                    <tr>
                        <td style="text-align: left">Foydalanuvchi nomi</td>
                        <td style="text-align: right">
                                <span id="username-view">
                                    <span id="username"></span>
                                </span>

                            <span id="username-edit" style="display:none;">
                                    <input type="text" id="username-input" autocomplete="username"/>
                                    <button id="save-username" title="Saqlash">💾</button>
                                    <button id="cancel-username" title="Bekor qilish">✖</button>
                                </span>

                            <button id="edit" style="margin-left: 20px" title="Tahrirlash">✏️</button>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left">Email</td>
                        <td style="text-align: right">
                                <span id="email-view">
                                    <span id="email">—</span>
                                </span>

                            <span id="email-edit" style="display:none;">
                                    <input type="email" id="email-input" autocomplete="email"/>
                                    <button id="save-email" title="Saqlash">💾</button>
                                    <button id="cancel-email" title="Bekor qilish">✖</button>
                                </span>

                            <button id="edit-email" style="margin-left: 20px" title="Tahrirlash">✏️</button>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left">Telefon</td>
                        <td style="text-align: right">
                                <span id="phone-view">
                                    <span id="phone">—</span>
                                </span>

                            <span id="phone-edit" style="display:none;">
                                <span style="display:inline-flex; gap:4px; vertical-align:middle;">
                                    <span id="phone-country-picker" style="display:inline-block;"></span>
                                    <input type="tel" id="phone-input" placeholder="Telefon raqam" autocomplete="tel" style="width:140px;">
                                </span>
                                    <button id="save-phone" title="Saqlash">💾</button>
                                    <button id="cancel-phone" title="Bekor qilish">✖</button>
                                </span>

                            <button id="edit-phone" style="margin-left: 20px" title="Tahrirlash">✏️</button>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left">Rol</td>
                        <td style="text-align: right"><span id="role"></span></td>
                    </tr>
                </table>

            </div>
            <!-- 🔐 Change password modal -->
            <div id="password-modal" class="modal hidden">
                <div class="modal-content">
                    <h3>Parolni o‘zgartirish</h3>

                    <label>Hozirgi parol</label>
                    <input type="password" id="currentPassword" autocomplete="current-password">

                    <label>Yangi parol</label>
                    <input type="password" id="newPassword" autocomplete="new-password">

                    <div class="modal-actions">
                        <button id="save-password">Saqlash</button>
                        <button id="close-password-modal">Bekor qilish</button>
                    </div>
                </div>
            </div>

            <!-- кнопка открытия -->
            <button id="open-password-modal" style="margin-top:10px;">
                🔐 Parolni o‘zgartirish
            </button>
        </div>
    </div>

    <!-- Ko'rsatkichlar (Jami testlar/O'rtacha natija va h.k.) endi shu yerda
         emas — /student sahifasidagi "Statistika" tugmasida ko'rsatiladi. -->


    <!-- Onlayn to'lov (Payme/Click) — faqat shlyuz sozlangan bo'lsa ko'rinadi
         (profile.js -> loadPaymentConfig), OWNER'da hech qachon ko'rinmaydi. -->
    <div id="onlinePaymentSection" class="profile-container-up" style="display:none;">
        <div class="profile-container-left" style="width:100%;">
            <h2 style="text-align: center">💳 ADMIN huquqini onlayn sotib olish</h2>
            <p style="text-align:center; color:#666;" id="pricePerMonthText"></p>
            <div style="display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;">
                <label>Necha oy: <input type="number" id="paymentMonths" value="1" min="1" max="24" style="width:70px;"></label>
                <button id="payWithPaymeBtn" style="display:none;" onclick="startPayment('PAYME')">Payme orqali to'lash</button>
                <button id="payWithClickBtn" style="display:none;" onclick="startPayment('CLICK')">Click orqali to'lash</button>
            </div>
        </div>
    </div>

    <!-- Test tarixi endi shu yerda emas — /student sahifasidagi "Statistika"
         tugmasi orqali ko'rsatiladi (bir xil /api/profile/history manbasidan). -->
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="/js/profile.js"></script>
</body>
</html>
