<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Darslar</title>

    <!-- Подключение CSS, jS -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/science.css">
    <link rel="stylesheet" href="/css/topic-explanation-search.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/topic.js" defer></script>

        <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">


    <style>

    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Darslar<span id="topicsSummary" class="topics-summary"></span></h1>
<input type="hidden" id="scienceId" th:value="${scienceId}">
<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="wrapper">
    <button id="btnSections" onclick="location.href='/topic-sections?scienceId=' + getScienceId() + fieldQuery">📂 Mavzular</button>
    <!-- Shu Bo'limdagi hech qanday savoli (testi) yo'q BARCHA darslarni
         bir yo'la o'chiradi (deleteQuestionlessTopics, topic.js). -->
    <button onclick="deleteQuestionlessTopics()">🗑️ Testi yo'q darslarni o'chirish</button>
    <!-- Soft-delete qilingan (🗑️ o'chirilgan) darslar — "♻️ Tiklash" bilan
         bir zumda qaytariladi (TopicService.getDeletedTopics/restoreTopic). -->
    <button onclick="toggleTopicTrash()">🗑️ O'chirilgan darslar <span id="topicTrashBadge" class="notif-badge" style="display:none;">0</span></button>

    <div id="topicTrashPanel" style="display:none;">
        <div id="topicTrashList"></div>
    </div>

    <!-- Shu FANNING BARCHA mavzularidagi o'chirilgan testlar — bitta joyda
         (har bir savol qaysi mavzu/bo'limga tegishli ekani bilan birga).
         Alohida-alohida mavzu sahifasidagi (question.html) savatdan farqli,
         bu yerda BUTUN fan bo'yicha bitta ro'yxat (topic.js#
         toggleQuestionScienceTrash/loadQuestionScienceTrash). -->
    <button onclick="toggleQuestionScienceTrash()">🗑️ Barcha o'chirilgan testlar <span id="questionScienceTrashBadge" class="notif-badge" style="display:none;">0</span></button>

    <div id="questionScienceTrashPanel" style="display:none;">
        <div id="questionScienceTrashList"></div>
    </div>

    <!-- Kursga hali bog'lanmagan mavzularni ajratib ko'rsatish (yoqilsa —
         faqat ular ko'rinadi) — o'quv rejasini kursga to'liq bog'lab
         chiqishda qaysi mavzular hali "yetim" ekanini topish uchun
         (toggleUnlinkedFilter, topic.js). -->
    <button id="unlinkedFilterBtn" class="unlinked-filter-btn" onclick="toggleUnlinkedFilter()">🔗 Kursga bog'lanmagan darslar <span id="unlinkedTopicBadge" class="notif-badge" style="display:none;">0</span></button>

    <!-- Mavzu ustidan (Bo'lim -> Mavzu -> Dars) kelinganda ko'rinadi —
         qaysi mavzu darslari filtrlanib ko'rsatilayotganini bildiradi
         (topic.js#DOMContentLoaded to'ldiradi/ko'rsatadi). -->
    <div class="section-filter-banner hidden" id="sectionFilterBanner"></div>

    <!-- Sahifadagi darslar bog'langan kurs(lar) ichidan, o'sha
         kurslarning BARCHA darsga bog'langan mavzularidagi matn
         darsi ("dars yoritmasi") bo'yicha qidiradi (runExplanationSearch,
         topic.js). Topilgan darsga bosilsa — o'sha kurs darsining
         o'ziga o'tkazadi. -->
    <div class="explanation-search-box" id="explanationSearchBox">
        <input type="text" id="explanationSearchInput" class="explanation-search-input"
               placeholder="🔍 Kurs ichidan qidirish (dars yoritmasidan)...">
        <div id="explanationSearchResults" class="explanation-search-results hidden"></div>
    </div>

    <div class="sort-buttons">
        <span>Saralash:</span>
        <button onclick="sortAllAZ('AZ')">A→Z</button>
        <button onclick="sortAllAZ('ZA')">Z→A</button>
    </div>

    <!--
        БЛОК ДЛЯ ОТОБРАЖЕНИЯ СООБЩЕНИЙ ОБ ОШИБКАХ
        Скрыт, так как используем Toast-уведомления
    -->
    <div class="error" id="error"></div>

    <!-- КОНТЕЙНЕР СПИСКА ПРЕДМЕТОВ -->
    <div class="list" id="list"></div>

    <!-- НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ УПРАВЛЕНИЯ. "💾 Save to DB" olib
         tashlandi — o'zgarishlar endi DARHOL bazaga yoziladi
         (foydalanuvchi so'rovi, 2026-09-05). -->
    <div class="fixed-bar">
        <div>
            <!-- КНОПКА ДОБАВЛЕНИЯ НОВОГО ПРЕДМЕТА -->
            <button onclick="add()">➕ Add</button>
            <button id="btnBack">🔙 Back</button>
        </div>
    </div>
</div>

<!-- "📝 Word'ga eksport" oynasi — ichida "🎲 Variantlar yaratish" checkbox'i
     (galochka qo'yilmasa oddiy bitta faylli eksport, qo'yilsa har biri
     boshqa savollardan iborat bir nechta variant + javoblar kaliti, ZIP
     holida — topic.js#confirmWordExport). Qaysi mavzu uchun ekanini
     openWordExportModal(id) saqlab qo'yadi (qator tugmasi bosilganda). -->
<div id="wordExportModal" class="modal-overlay">
    <div class="word-export-modal">
        <h2 class="modal-h2">📝 Word'ga eksport</h2>

        <label class="word-export-checkbox-row">
            <input type="checkbox" id="wordExportVariantsCheckbox" onchange="toggleWordExportVariantFields()">
            🎲 Variantlar yaratish (har bir talaba uchun boshqa-boshqa variant)
        </label>

        <div id="wordExportVariantFields" class="word-export-variant-fields hidden">
            <label>
                Nechta variant (talabalar soni)
                <input type="number" id="wordExportVariantCount" min="1" value="30">
            </label>
            <label>
                Har bir variantga nechta savol
                <input type="number" id="wordExportPerVariant" min="1" value="50">
            </label>

            <div class="word-export-mode-group">
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="different" checked onchange="updateWordExportHint()">
                    🔀 Har biriga boshqa-boshqa savollar
                </label>
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="same" onchange="updateWordExportHint()">
                    🎯 Barchasiga bir xil savollar (faqat tartibi aralashtiriladi)
                </label>
            </div>

            <label class="word-export-checkbox-row">
                <input type="checkbox" id="wordExportShuffleAnswers" checked>
                Javob variantlari (A,B,C,D,E) tartibi ham aralashtirilsin
            </label>
            <p class="word-export-hint" id="wordExportHint">
                Savollar shu darsdan tasodifiy tanlanadi. Natija — har biri
                alohida .docx fayl bo'lgan ZIP arxiv + javoblar kaliti (Excel).
            </p>
        </div>

        <div class="modal-footer">
            <button type="button" onclick="closeWordExportModal()">Bekor qilish</button>
            <button type="button" id="wordExportConfirmBtn" class="export-excel-btn" onclick="confirmWordExport()">Eksport qilish</button>
        </div>
    </div>
</div>

<!-- Контейнер для Toast-уведомлений (добавлено) -->
<div id="toast-container"></div>
</body>
</html>
