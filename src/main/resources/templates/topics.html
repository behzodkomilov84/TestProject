<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Darslar</title>

    <!-- Подключение CSS, jS -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/science.css">
    <link rel="stylesheet" href="/css/topic-explanation-search.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/topic.js" defer></script>

        <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">


    <style>

    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Bo'limlar sahifasidagi (science.html) "← Yo'nalishlar / <nomi>"
     breadcrumb'i bilan BIR XIL ko'rinish — Mavzu ustidan kelingan bo'lsa
     "← Mavzular / <Mavzu>", aks holda to'g'ridan-to'g'ri "← Bo'limlar /
     <Bo'lim>" (foydalanuvchi so'rovi, 2026-09-05: "iyerarxiyaning boshqa
     qismlariga ham qo'sh"), topic.js#applyScopeBar to'ldiradi. -->
<div id="topicScopeBar" class="field-scope-bar hidden">
    <a href="#" id="topicScopeBackLink" class="field-scope-back">← Bo'limlar</a>
    <span id="topicScopeName" class="field-scope-name"></span>
</div>

<!-- Bo'limlar sahifasi (science.html) bilan BIR XIL sarlavha qatori —
     nomi, soni va "+ Yangi dars" bitta gorizontal qatorda (foydalanuvchi
     so'rovi, 2026-09-05: "topicSection va topic sahifalarida ham shu
     ko'rinishni qo'lla"). Pastdagi "➕ Add" tugmasi shu sabab OLIB
     TASHLANDI. -->
<div class="page-title-row">
    <h1>Darslar</h1>
    <div class="page-title-actions">
        <span class="chapter-box-count" id="topicsSummary"></span>
        <button class="add-primary-btn" onclick="add()">➕ Yangi dars</button>
    </div>
</div>
<input type="hidden" id="scienceId" th:value="${scienceId}">
<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="wrapper">
    <!-- "📂 Mavzular" tugmasi OLIB TASHLANDI — yuqoridagi "← Mavzular"
         breadcrumb havolasi (sectionFilterBanner) ALLAQACHON shu vazifani
         bajaradi, ikkalasi ORTIQCHA edi (foydalanuvchi so'rovi, 2026-09-05:
         "Mavzular knopkasini olib tashla. Tepadagi tursa bo'ldi"). -->
    <!-- Shu Fandagi hech qanday savoli (testi) yo'q darslarni RO'YXAT
         sifatida ko'rsatadi (modalda) — ilgari to'g'ridan-to'g'ri (ro'yxatni
         ko'rsatmasdan) o'chirib yuborardi, shu sabab qaysi dars(lar)
         ekanini topish qiyin edi (foydalanuvchi xabari, 2026-09-05: "1 та
         тести йўқ дарс бор деяпти, лекин рўйхатда кўринмаяпти"). Endi
         avval RO'YXAT ko'rsatiladi, o'chirish esa O'SHA modal ICHIDAGI
         alohida tugma orqali amalga oshiriladi (toggleQuestionlessTopicsModal/
         deleteQuestionlessTopics, topic.js). -->
    <button onclick="toggleQuestionlessTopicsModal()">📋 Testi yo'q darslar <span id="questionlessTopicsBadge" class="notif-badge" style="display:none;">0</span></button>
    <!-- Soft-delete qilingan (🗑️ o'chirilgan) darslar — "♻️ Tiklash" bilan
         bir zumda qaytariladi (TopicService.getDeletedTopics/restoreTopic). -->
    <button onclick="toggleTopicTrash()">🗑️ O'chirilgan darslar <span id="topicTrashBadge" class="notif-badge" style="display:none;">0</span></button>

    <!-- Shu FANNING BARCHA mavzularidagi o'chirilgan testlar — bitta joyda
         (har bir savol qaysi mavzu/bo'limga tegishli ekani bilan birga).
         Alohida-alohida mavzu sahifasidagi (question.html) savatdan farqli,
         bu yerda BUTUN fan bo'yicha bitta ro'yxat (topic.js#
         toggleQuestionScienceTrash/loadQuestionScienceTrash). -->
    <button onclick="toggleQuestionScienceTrash()">🗑️ Barcha o'chirilgan testlar <span id="questionScienceTrashBadge" class="notif-badge" style="display:none;">0</span></button>

    <!-- Kursga hali bog'lanmagan mavzularni ajratib ko'rsatish (yoqilsa —
         faqat ular ko'rinadi) — o'quv rejasini kursga to'liq bog'lab
         chiqishda qaysi mavzular hali "yetim" ekanini topish uchun
         (toggleUnlinkedFilter, topic.js). -->
    <button id="unlinkedFilterBtn" class="unlinked-filter-btn" onclick="toggleUnlinkedFilter()">🔗 Kursga bog'lanmagan darslar <span id="unlinkedTopicBadge" class="notif-badge" style="display:none;">0</span></button>

    <!-- Mavzu ustidan (Bo'lim -> Mavzu -> Dars) kelinganda ko'rinadi —
         qaysi mavzu darslari filtrlanib ko'rsatilayotganini bildiradi
         (topic.js#DOMContentLoaded to'ldiradi/ko'rsatadi). -->
    <div class="section-filter-banner hidden" id="sectionFilterBanner"></div>

    <!-- Sahifadagi darslar bog'langan kurs(lar) ichidan, o'sha
         kurslarning BARCHA darsga bog'langan mavzularidagi matn
         darsi ("dars yoritmasi") bo'yicha qidiradi (runExplanationSearch,
         topic.js). Topilgan darsga bosilsa — o'sha kurs darsining
         o'ziga o'tkazadi. -->
    <div class="explanation-search-box" id="explanationSearchBox">
        <input type="text" id="explanationSearchInput" class="explanation-search-input"
               placeholder="🔍 Kurs ichidan qidirish (dars yoritmasidan)...">
        <div id="explanationSearchResults" class="explanation-search-results hidden"></div>
    </div>

    <div class="sort-buttons">
        <span>Saralash:</span>
        <button onclick="sortAllAZ('AZ')">A→Z</button>
        <button onclick="sortAllAZ('ZA')">Z→A</button>
    </div>

    <!--
        БЛОК ДЛЯ ОТОБРАЖЕНИЯ СООБЩЕНИЙ ОБ ОШИБКАХ
        Скрыт, так как используем Toast-уведомления
    -->
    <div class="error" id="error"></div>

    <!-- КОНТЕЙНЕР СПИСКА ПРЕДМЕТОВ -->
    <div class="list" id="list"></div>

    <!-- НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ УПРАВЛЕНИЯ. "➕ Add" va "💾 Save to DB"
         olib tashlandi (foydalanuvchi so'rovi, 2026-09-05): yangi dars
         qo'shish endi yuqoridagi sarlavha qatoridagi "+ Yangi dars"
         tugmasi orqali, o'zgarishlar esa DARHOL bazaga yoziladi. "🔙 Back"
         tugmasi ham olib tashlandi (foydalanuvchi so'rovi, 2026-09-05) —
         bu vazifani endi yuqoridagi "← Bo'limlar"/"← Mavzular" breadcrumb
         havolasi bajaradi. -->
</div>

<!-- "🗑️ O'chirilgan darslar" / "🗑️ Barcha o'chirilgan testlar" — ilgari
     tugmalar QATORI ICHIDA (block-level <div>) ochilib, o'zidan keyingi
     tugmalarni pastga surib yuborardi (haqiqiy topilgan bug). Endi
     ikkalasi ham modalda ochiladi — sahifa joylashuviga UMUMAN ta'sir
     qilmaydi (foydalanuvchi so'rovi, 2026-09-05: "Ўчирилган дарслар ва
     барча ўчирилган тестларни модалда очсин"). toggleTopicTrash/
     toggleQuestionScienceTrash — topic.js. -->
<div id="topicTrashModal" class="modal-overlay">
    <div class="trash-list-modal">
        <h2 class="modal-h2">🗑️ O'chirilgan darslar</h2>
        <div id="topicTrashList"></div>
        <div class="modal-footer">
            <button type="button" onclick="toggleTopicTrash()">Yopish</button>
        </div>
    </div>
</div>

<div id="questionScienceTrashModal" class="modal-overlay">
    <div class="trash-list-modal">
        <h2 class="modal-h2">🗑️ Barcha o'chirilgan testlar</h2>
        <div id="questionScienceTrashList"></div>
        <div class="modal-footer">
            <button type="button" onclick="toggleQuestionScienceTrash()">Yopish</button>
        </div>
    </div>
</div>

<!-- "📋 Testi yo'q darslar" — avval RO'YXAT ko'rsatiladi (qaysi dars(lar)
     ekani, va agar joriy Mavzu filtridan tashqarida bo'lsa — qaysi
     Mavzuga tegishli ekani), o'chirish esa shu YERDAGI alohida tugma
     orqali (foydalanuvchi so'rovi, 2026-09-05: "Тести йўқ дарсларни
     ўчириш кнопкаси ўрнига Тести йўқ дарслар кнопкасини жойла. Бу
     босилгандан кейин ... ўзида action орқали қилинаверади"). Soft-delete
     — "🗑️ O'chirilgan darslar"dan ("♻️ Tiklash" bilan) qaytariladi. -->
<div id="questionlessTopicsModal" class="modal-overlay">
    <div class="trash-list-modal">
        <h2 class="modal-h2">📋 Testi yo'q darslar</h2>
        <div id="questionlessTopicsList"></div>
        <div class="modal-footer">
            <button type="button" id="deleteQuestionlessTopicsBtn" class="danger-btn hidden" onclick="deleteQuestionlessTopics()">🗑️ Barchasini o'chirish</button>
            <button type="button" onclick="toggleQuestionlessTopicsModal()">Yopish</button>
        </div>
    </div>
</div>

<!-- "📝 Word'ga eksport" oynasi — ichida "🎲 Variantlar yaratish" checkbox'i
     (galochka qo'yilmasa oddiy bitta faylli eksport, qo'yilsa har biri
     boshqa savollardan iborat bir nechta variant + javoblar kaliti, ZIP
     holida — topic.js#confirmWordExport). Qaysi mavzu uchun ekanini
     openWordExportModal(id) saqlab qo'yadi (qator tugmasi bosilganda). -->
<div id="wordExportModal" class="modal-overlay">
    <div class="word-export-modal">
        <h2 class="modal-h2">📝 Word'ga eksport</h2>

        <label class="word-export-checkbox-row">
            <input type="checkbox" id="wordExportVariantsCheckbox" onchange="toggleWordExportVariantFields()">
            🎲 Variantlar yaratish (har bir talaba uchun boshqa-boshqa variant)
        </label>

        <div id="wordExportVariantFields" class="word-export-variant-fields hidden">
            <label>
                Nechta variant (talabalar soni)
                <input type="number" id="wordExportVariantCount" min="1" value="30">
            </label>
            <label>
                Har bir variantga nechta savol
                <input type="number" id="wordExportPerVariant" min="1" value="50">
            </label>

            <div class="word-export-mode-group">
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="different" checked onchange="updateWordExportHint()">
                    🔀 Har biriga boshqa-boshqa savollar
                </label>
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="same" onchange="updateWordExportHint()">
                    🎯 Barchasiga bir xil savollar (faqat tartibi aralashtiriladi)
                </label>
            </div>

            <label class="word-export-checkbox-row">
                <input type="checkbox" id="wordExportShuffleAnswers" checked>
                Javob variantlari (A,B,C,D,E) tartibi ham aralashtirilsin
            </label>
            <p class="word-export-hint" id="wordExportHint">
                Savollar shu darsdan tasodifiy tanlanadi. Natija — har biri
                alohida .docx fayl bo'lgan ZIP arxiv + javoblar kaliti (Excel).
            </p>
        </div>

        <div class="modal-footer">
            <button type="button" onclick="closeWordExportModal()">Bekor qilish</button>
            <button type="button" id="wordExportConfirmBtn" class="export-excel-btn" onclick="confirmWordExport()">Eksport qilish</button>
        </div>
    </div>
</div>

<!-- Контейнер для Toast-уведомлений (добавлено) -->
<div id="toast-container"></div>
</body>
</html>
