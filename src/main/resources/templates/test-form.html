<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание теста</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/test-form.css">
    <script src="/js/test-form.js" defer></script>
</head>

<body>

<div class="container">
    <h1>Test yaratish</h1>

    <div class="top-btn">
        <div class="left-btn">
            <button class="btn-import" type="button" onclick="importExcel()" title="Avval shablonni yuklab oling, to'ldirib qayta import qiling.">📥 Import from Excel</button>
            <input type="file" id="excelFile" accept=".xlsx" hidden>
        </div>
        <div class="right-btn">
            <button class="btn-export" type="button" onclick="downloadTemplate()">
                📄 Shablon
            </button>
        </div>


    </div>



    <div id="importModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="importTitle"></h3>
            <pre id="importBody"></pre>
            <button class="btn primary" onclick="closeModal()">OK</button>
        </div>
    </div>


    <form id="testForm">

        <!-- topicId из URL -->
        <input type="hidden" id="topicId" th:value="${topicId}">
        <!-- Вопрос -->
        <div class="form-group">
            <label for="question">Savol</label>
            <textarea id="question" name="question" class="auto-textarea" placeholder="Savol matnini kiriting" required></textarea>

            <!-- Savolga rasm qo'shish (masalan, geometrik chizma) -->
            <div class="image-upload" data-role="question-image">
                <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" id="questionImageInput" hidden>
                <button type="button" class="btn image-btn">🖼️ Rasm qo'shish</button>
                <img class="image-preview hidden" alt="Savol rasmi">
                <button type="button" class="btn remove-image-btn hidden">✖ Rasmni olib tashlash</button>
            </div>
        </div>

        <!-- Ответы -->
        <div class="answers">
            <h3>Javob variantlari</h3>

            <div class="answer">
                <input type="radio" name="correct" value="0" required>
                <textarea class="auto-textarea" name="answers[0]" placeholder="A variantni kiriting..." required></textarea>
                <div class="image-upload" data-role="answer-image">
                    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                    <button type="button" class="btn image-btn">🖼️ Rasm</button>
                    <img class="image-preview hidden" alt="A javob rasmi">
                    <button type="button" class="btn remove-image-btn hidden">✖</button>
                </div>
                <button type="button" class="comment-btn btn hidden">✏️Izoh</button>
                <div class="commentary-box hidden">
                    <textarea class="commentary"
                              name="commentaries[0]"
                              placeholder="To'g'ri javob uchun izoh kiriting..."></textarea>
                    <button type="button" class="btn link-btn hidden">🔗 Mavzuga havola qo'shish</button>

                    <div class="commentary-media">
                        <div class="image-upload" data-role="commentary-image">
                            <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                            <button type="button" class="btn image-btn">🖼️ Rasm</button>
                            <img class="image-preview hidden" alt="Izoh rasmi">
                            <button type="button" class="btn remove-image-btn hidden">✖</button>
                        </div>
                        <div class="video-upload" data-role="commentary-video">
                            <input type="file" accept="video/mp4,video/webm,video/ogg" class="video-input" hidden>
                            <button type="button" class="btn video-btn">🎬 Video</button>
                            <video class="video-preview hidden" controls></video>
                            <button type="button" class="btn remove-video-btn hidden">✖</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="answer">
                <input type="radio" name="correct" value="1">
                <textarea class="auto-textarea" name="answers[1]" placeholder="B variantni kiriting..." required></textarea>
                <div class="image-upload" data-role="answer-image">
                    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                    <button type="button" class="btn image-btn">🖼️ Rasm</button>
                    <img class="image-preview hidden" alt="B javob rasmi">
                    <button type="button" class="btn remove-image-btn hidden">✖</button>
                </div>
                <button type="button" class="comment-btn btn hidden">✏️Izoh</button>
                <div class="commentary-box hidden">
                    <textarea class="commentary"
                              name="commentaries[1]"
                              placeholder="To'g'ri javob uchun izoh kiriting..."></textarea>
                    <button type="button" class="btn link-btn hidden">🔗 Mavzuga havola qo'shish</button>

                    <div class="commentary-media">
                        <div class="image-upload" data-role="commentary-image">
                            <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                            <button type="button" class="btn image-btn">🖼️ Rasm</button>
                            <img class="image-preview hidden" alt="Izoh rasmi">
                            <button type="button" class="btn remove-image-btn hidden">✖</button>
                        </div>
                        <div class="video-upload" data-role="commentary-video">
                            <input type="file" accept="video/mp4,video/webm,video/ogg" class="video-input" hidden>
                            <button type="button" class="btn video-btn">🎬 Video</button>
                            <video class="video-preview hidden" controls></video>
                            <button type="button" class="btn remove-video-btn hidden">✖</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="answer">
                <input type="radio" name="correct" value="2">
                <textarea class="auto-textarea" name="answers[2]" placeholder="C variantni kiriting..." required></textarea>
                <div class="image-upload" data-role="answer-image">
                    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                    <button type="button" class="btn image-btn">🖼️ Rasm</button>
                    <img class="image-preview hidden" alt="C javob rasmi">
                    <button type="button" class="btn remove-image-btn hidden">✖</button>
                </div>
                <button type="button" class="comment-btn btn hidden">✏️Izoh</button>
                <div class="commentary-box hidden">
                    <textarea class="commentary"
                              name="commentaries[2]"
                              placeholder="To'g'ri javob uchun izoh kiriting..."></textarea>
                    <button type="button" class="btn link-btn hidden">🔗 Mavzuga havola qo'shish</button>

                    <div class="commentary-media">
                        <div class="image-upload" data-role="commentary-image">
                            <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                            <button type="button" class="btn image-btn">🖼️ Rasm</button>
                            <img class="image-preview hidden" alt="Izoh rasmi">
                            <button type="button" class="btn remove-image-btn hidden">✖</button>
                        </div>
                        <div class="video-upload" data-role="commentary-video">
                            <input type="file" accept="video/mp4,video/webm,video/ogg" class="video-input" hidden>
                            <button type="button" class="btn video-btn">🎬 Video</button>
                            <video class="video-preview hidden" controls></video>
                            <button type="button" class="btn remove-video-btn hidden">✖</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="answer">
                <input type="radio" name="correct" value="3">
                <textarea class="auto-textarea" name="answers[3]" placeholder="D variantni kiriting..." required></textarea>
                <div class="image-upload" data-role="answer-image">
                    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                    <button type="button" class="btn image-btn">🖼️ Rasm</button>
                    <img class="image-preview hidden" alt="D javob rasmi">
                    <button type="button" class="btn remove-image-btn hidden">✖</button>
                </div>
                <button type="button" class="comment-btn btn hidden">✏️Izoh</button>
                <div class="commentary-box hidden">
                    <textarea class="commentary"
                              name="commentaries[3]"
                              placeholder="To'g'ri javob uchun izoh kiriting..."></textarea>
                    <button type="button" class="btn link-btn hidden">🔗 Mavzuga havola qo'shish</button>

                    <div class="commentary-media">
                        <div class="image-upload" data-role="commentary-image">
                            <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                            <button type="button" class="btn image-btn">🖼️ Rasm</button>
                            <img class="image-preview hidden" alt="Izoh rasmi">
                            <button type="button" class="btn remove-image-btn hidden">✖</button>
                        </div>
                        <div class="video-upload" data-role="commentary-video">
                            <input type="file" accept="video/mp4,video/webm,video/ogg" class="video-input" hidden>
                            <button type="button" class="btn video-btn">🎬 Video</button>
                            <video class="video-preview hidden" controls></video>
                            <button type="button" class="btn remove-video-btn hidden">✖</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="answer">
                <input type="radio" name="correct" value="4">
                <textarea class="auto-textarea" name="answers[4]" placeholder="E variantni kiriting..." required></textarea>
                <div class="image-upload" data-role="answer-image">
                    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                    <button type="button" class="btn image-btn">🖼️ Rasm</button>
                    <img class="image-preview hidden" alt="E javob rasmi">
                    <button type="button" class="btn remove-image-btn hidden">✖</button>
                </div>
                <button type="button" class="comment-btn btn hidden">✏️Izoh</button>
                <div class="commentary-box hidden">
                    <textarea class="commentary"
                              name="commentaries[4]"
                              placeholder="To'g'ri javob uchun izoh kiriting..."></textarea>
                    <button type="button" class="btn link-btn hidden">🔗 Mavzuga havola qo'shish</button>

                    <div class="commentary-media">
                        <div class="image-upload" data-role="commentary-image">
                            <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="image-input" hidden>
                            <button type="button" class="btn image-btn">🖼️ Rasm</button>
                            <img class="image-preview hidden" alt="Izoh rasmi">
                            <button type="button" class="btn remove-image-btn hidden">✖</button>
                        </div>
                        <div class="video-upload" data-role="commentary-video">
                            <input type="file" accept="video/mp4,video/webm,video/ogg" class="video-input" hidden>
                            <button type="button" class="btn video-btn">🎬 Video</button>
                            <video class="video-preview hidden" controls></video>
                            <button type="button" class="btn remove-video-btn hidden">✖</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="actions">
            <button type="submit" class="btn primary">💾 Saqlash</button>
            <button type="reset" class="btn">↩ Tozalash</button>
            <button type="button" class="btn secondary" onclick="history.back()">⬅ Orqaga</button>
        </div>
    </form>
</div>



</body>

</html>
