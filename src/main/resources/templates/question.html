<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Tests by Topic</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/navbar.css"></link>
    <link rel="stylesheet" href="/css/question.css"></link>

    <script src="/js/navbar.js" defer></script>

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div id="alertBox" class="alert hidden"></div>

<div class="container">

    <div class="top-element" id="topElement">
        <div class="top-element-left">
            <button class="back-btn" onclick="goBack()">← MAVZUGA QAYTISH</button>
            <!-- Soft-delete qilingan (🗑️ o'chirilgan) savollar — "♻️ Tiklash"
                 bilan bir zumda qaytariladi (QuestionService.getDeletedQuestions/restoreQuestion). -->
            <button class="back-btn" onclick="toggleQuestionTrash()">🗑️ O'chirilganlar <span id="questionTrashBadge" class="notif-badge" style="display:none;">0</span></button>
        </div>

        <h1>Mavzuga oid testlar</h1>
        <input type="hidden" id="topicId" th:value="${topicId}">

        <button class="create-btn" onclick="createTest()">➕ TEST YARATISH</button>
    </div>

    <!-- Mavzu nomi — ATAYLAB yuqoridagi ".top-element" boksidan TASHQARIDA,
         alohida qatorda (h1 ichida bo'lganda shrifti juda katta va box'ga
         "sig'may" ko'rinardi). Shrifti clamp() bilan ekran kengligiga
         qarab avtomatik kichrayadi/kattalashadi (responsive). -->
    <div class="topic-name-subheading" id="topicNameHeading"></div>

    <div id="questionTrashPanel" style="display:none;">
        <div id="questionTrashList"></div>
    </div>

    <div class="controls">

        <input type="text"
               id="searchInput"
               placeholder="🔍 Savolni qidirish..."
               class="search-input"
               autocomplete="off"
        >


        <select id="pageSizeSelect" class="page-size-select">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="all" selected>Hammasi</option>
        </select>

        <!-- Faqat qidiruv bo'sh bo'lganda ko'rinadi (sahifalash holatidan
             qat'i nazar — bosilganda har doim /api/question/all orqali
             mavzuning TO'LIQ ro'yxati qayta yuklanib, o'shanga nisbatan
             saralanadi: question.js#sortAllAZ/updateSortButtonsVisibility). -->
        <div class="sort-buttons hidden" id="questionSortButtons">
            <span>Saralash:</span>
            <button onclick="sortAllAZ('AZ')">A→Z</button>
            <button onclick="sortAllAZ('ZA')">Z→A</button>
        </div>

        <!-- Shu mavzudagi BARCHA faol savollarni Excel (.xlsx) fayl
             sifatida yuklab olish — import shabloni bilan bir xil
             formatda, shu sabab keyin qayta import ham qilish mumkin. -->
        <button id="exportExcelBtn" class="export-excel-btn" onclick="exportQuestionsToExcel()" title="Shu mavzudagi barcha faol savollarni Excel (.xlsx) faylga yuklab olish"><svg width="16" height="16" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-3px;margin-right:4px;"><rect x="4" y="4" width="40" height="40" rx="7" fill="#107C41"/><rect x="4" y="4" width="18" height="40" rx="7" fill="#0B5C31"/><g stroke="#fff" stroke-width="4" stroke-linecap="round"><line x1="14" y1="16" x2="30" y2="32"/><line x1="30" y1="16" x2="14" y2="32"/></g></svg>Excel'ga eksport</button>

        <!-- Shu mavzudagi BARCHA faol savollarni chop etishga tayyor
             .docx fayl sifatida yuklab olish — sarlavhada mavzu nomi,
             savollar tartib raqami bilan, javoblari A/B/C/D/E sifatida
             (izohsiz, to'g'ri javobsiz — Excel eksportdan farqli, bu
             hisobot emas, bosib chiqarish/tarqatish uchun). -->
        <button id="exportWordBtn" class="export-excel-btn" onclick="exportQuestionsToWord()" title="Shu mavzudagi barcha faol savollarni Word (.docx) faylga yuklab olish"><svg width="16" height="16" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-3px;margin-right:4px;"><rect x="4" y="4" width="40" height="40" rx="7" fill="#185ABD"/><rect x="4" y="4" width="18" height="40" rx="7" fill="#103F91"/><text x="31" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">W</text></svg>Word'ga eksport</button>

        <!-- Kamida bitta savol jadvaldagi checkbox orqali belgilansa
             ko'rinadi (updateBulkDeleteButton, question.js). -->
        <button id="bulkDeleteBtn" class="bulk-delete-btn hidden" onclick="deleteSelectedQuestions()">🗑️ Tanlanganlarni o'chirish (<span id="bulkDeleteCount">0</span>)</button>

    </div>

    <div class="table-wrapper">

        <table id="questionsTable" class="questions-table">
            <thead>
            <tr>
                <th><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" title="Hammasini belgilash"></th>
                <th>№</th>
                <th>SAVOLLAR</th>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
                <th>E</th>
                <th title="To'g'ri javob">✅</th>
                <th class="comment-col hidden" title="Izoh">💬To'g'ri <br>javob izohi</th>
                <th title="Butun mavzu bo'yicha tartiblaydi, sahifalashdan qat'i nazar">Tartib</th>
                <th>Amallar</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="pagination" class="pagination"></div>

    <!-- Modal для комментариев -->
    <div id="commentModal" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-h2">To'g'ri javob uchun izoh</h2>

            <textarea id="modalComment" readonly></textarea>

            <!-- Izohga biriktirilgan rasm/video (faqat ko'rish uchun — bu
                 sahifada media tahrirlanmaydi, "Test yaratish" formasida qo'shiladi/o'zgartiriladi) -->
            <img id="modalCommentImage" class="modal-comment-image hidden" alt="Izoh rasmi">
            <video id="modalCommentVideo" class="modal-comment-video hidden" controls></video>

            <div class="modal-footer">
                <button id="modalEdit" class="modalEdit">✏️ Tahrirlash</button>
                <button id="modalLinkBtn" class="modalLinkBtn hidden" disabled>🔗 Mavzuga havola qo'shish</button>
                <button id="modalSaveBtn" disabled class="modalSaveBtn">💾 Saqlash</button>
                <button onclick="closeCommentModal()" class="closeCommentModal">❌ Yopish</button>
            </div>
        </div>
    </div>



</div>

<script src="/js/topicLinkButton.js"></script>
<script src="/js/question.js"></script>
</body>
</html>
