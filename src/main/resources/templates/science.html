<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Science</title>

    <!-- Подключение CSS, JS -->
    <link rel="stylesheet" href="/css/science.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/science.js" defer></script>
    <!-- Подключение шрифтов Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Fanlar</h1>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="wrapper">

    <!--
        БЛОК ДЛЯ ОТОБРАЖЕНИЯ СООБЩЕНИЙ ОБ ОШИБКАХ
        Скрыт, так как используем Toast-уведомления
    -->
    <!-- Soft-delete qilingan (🗑️ o'chirilgan) fanlar — "♻️ Tiklash" bilan
         bir zumda qaytariladi (ScienceService.getDeletedSciences/restoreScience). -->
    <button onclick="toggleScienceTrash()">🗑️ O'chirilgan fanlar</button>

    <div id="scienceTrashPanel" style="display:none;">
        <div id="scienceTrashList"></div>
    </div>

    <div class="sort-buttons">
        <span>Saralash:</span>
        <button onclick="sortAllAZ('AZ')">A→Z</button>
        <button onclick="sortAllAZ('ZA')">Z→A</button>
    </div>

    <div class="error" id="error"></div>

    <!-- КОНТЕЙНЕР СПИСКА ПРЕДМЕТОВ -->
    <div class="list" id="list"></div>

    <!-- НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ УПРАВЛЕНИЯ -->
    <div class="fixed-bar">
        <div>
            <!-- КНОПКА ДОБАВЛЕНИЯ НОВОГО ПРЕДМЕТА -->
            <button onclick="add()">➕ Add</button>

        </div>

            <!-- КНОПКА СОХРАНЕНИЯ В БАЗУ ДАННЫХ -->
            <button onclick="saveToDb()">💾 Save to DB</button>
    </div>
</div>

<!-- Контейнер для Toast-уведомлений (добавлено) -->
<div id="toast-container"></div>

<script>

</script>

</body>
</html>
