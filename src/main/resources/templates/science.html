<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Bo'limlar</title>

    <!-- Подключение CSS, JS -->
    <link rel="stylesheet" href="/css/science.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/promptModal.js" defer></script>
    <script src="/js/science.js" defer></script>
    <!-- Подключение шрифтов Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ?fieldId=<id> bilan kelinganda (odatiy holat — /science/fields
     sahifasidan bosib kelinadi) faqat shu Yo'nalishning Bo'limlari
     ko'rsatiladi, va yuqorida "← Yo'nalishlar"ga qaytish havolasi +
     Yo'nalish nomi chiqadi (science.js#applyFieldScope to'ldiradi). -->
<div id="fieldScopeBar" class="field-scope-bar hidden">
    <a href="/science/fields" class="field-scope-back">← Yo'nalishlar</a>
    <span id="fieldScopeName" class="field-scope-name"></span>
</div>

<h1 id="pageTitle">Bo'limlar</h1>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="wrapper">

    <!--
        БЛОК ДЛЯ ОТОБРАЖЕНИЯ СООБЩЕНИЙ ОБ ОШИБКАХ
        Скрыт, так как используем Toast-уведомления
    -->
    <!-- "Yo'nalish" — Bo'limlar (Science) ro'yxatini kattaroq guruhga
         bo'ladi, kurslar katalogidagi bilan BIR XIL Yo'nalish (umumiy —
         foydalanuvchi so'rovi, 2026-09-05). fieldId bilan (bitta
         Yo'nalish ichida) ko'rsatilganda bu tugma yashiriladi — Yo'nalish
         boshqaruvi endi /science/fields sahifasida (science.js#applyFieldScope). -->
    <button id="createFieldBtn" onclick="openCreateFieldForm()">+ Yangi Yo'nalish</button>
    <!-- Soft-delete qilingan (🗑️ o'chirilgan) fanlar — "♻️ Tiklash" bilan
         bir zumda qaytariladi (ScienceService.getDeletedSciences/restoreScience). -->
    <button onclick="toggleScienceTrash()">🗑️ O'chirilgan bo'limlar <span id="scienceTrashBadge" class="notif-badge" style="display:none;">0</span></button>

    <!-- Yangi Yo'nalish yaratish formasi (coursesCatalog.html#createFieldForm
         bilan bir xil andoza). -->
    <div id="createFieldForm" class="course-form" style="display:none;">
        <input type="text" id="newFieldName" placeholder="Yo'nalish nomi (masalan: Sanitariya epidemiologiya xizmati)">
        <div class="course-form-actions">
            <button onclick="submitCreateField()">✅ Yaratish</button>
            <button onclick="closeCreateFieldForm()">Bekor qilish</button>
        </div>
    </div>

    <div id="scienceTrashPanel" style="display:none;">
        <div id="scienceTrashList"></div>
    </div>

    <div class="sort-buttons">
        <span>Saralash:</span>
        <button onclick="sortAllAZ('AZ')">A→Z</button>
        <button onclick="sortAllAZ('ZA')">Z→A</button>
    </div>

    <div class="error" id="error"></div>

    <!-- КОНТЕЙНЕР СПИСКА ПРЕДМЕТОВ -->
    <div class="list" id="list"></div>

    <!-- НИЖНЯЯ ПАНЕЛЬ С КНОПКАМИ УПРАВЛЕНИЯ -->
    <div class="fixed-bar">
        <div>
            <!-- КНОПКА ДОБАВЛЕНИЯ НОВОГО ПРЕДМЕТА -->
            <button onclick="add()">➕ Add</button>

        </div>

            <!-- КНОПКА СОХРАНЕНИЯ В БАЗУ ДАННЫХ -->
            <button onclick="saveToDb()">💾 Save to DB</button>
    </div>
</div>

<!-- "📝 Word'ga eksport" oynasi — ichida "🎲 Variantlar yaratish" checkbox'i
     (galochka qo'yilmasa oddiy bitta faylli eksport, qo'yilsa har biri
     boshqa savollardan iborat bir nechta variant + javoblar kaliti, ZIP
     holida — science.js#confirmWordExport). -->
<div id="wordExportModal" class="modal-overlay">
    <div class="word-export-modal">
        <h2 class="modal-h2">📝 Word'ga eksport</h2>

        <label class="word-export-checkbox-row">
            <input type="checkbox" id="wordExportVariantsCheckbox" onchange="toggleWordExportVariantFields()">
            🎲 Variantlar yaratish (har bir talaba uchun boshqa-boshqa variant)
        </label>

        <div id="wordExportVariantFields" class="word-export-variant-fields hidden">
            <label>
                Nechta variant (talabalar soni)
                <input type="number" id="wordExportVariantCount" min="1" value="30">
            </label>
            <label>
                Har bir variantga nechta savol
                <input type="number" id="wordExportPerVariant" min="1" value="50">
            </label>

            <div class="word-export-mode-group">
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="different" checked onchange="updateWordExportHint()">
                    🔀 Har biriga boshqa-boshqa savollar
                </label>
                <label class="word-export-radio-row">
                    <input type="radio" name="wordExportVariantMode" value="same" onchange="updateWordExportHint()">
                    🎯 Barchasiga bir xil savollar (faqat tartibi aralashtiriladi)
                </label>
            </div>

            <label class="word-export-checkbox-row">
                <input type="checkbox" id="wordExportShuffleAnswers" checked>
                Javob variantlari (A,B,C,D,E) tartibi ham aralashtirilsin
            </label>
            <p class="word-export-hint" id="wordExportHint">
                Savollar shu bo'limdagi BARCHA darslar bo'yicha TENG
                taqsimlanadi (darsda savol yetmasa, qolgan qismi boshqa
                darslarga teng bo'lib beriladi). Natija — har biri alohida
                .docx fayl bo'lgan ZIP arxiv + javoblar kaliti (Excel).
            </p>
        </div>

        <div class="modal-footer">
            <button type="button" onclick="closeWordExportModal()">Bekor qilish</button>
            <button type="button" id="wordExportConfirmBtn" class="export-excel-btn" onclick="confirmWordExport()">Eksport qilish</button>
        </div>
    </div>
</div>

<!-- Контейнер для Toast-уведомлений (добавлено) -->
<div id="toast-container"></div>

<script>

</script>

</body>
</html>
