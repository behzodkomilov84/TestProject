<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/users.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <script src="/js/users.js" defer></script>
    <script src="/js/navbar.js" defer></script>
</head>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <header class="top-bar">
        <h1>👥 Foydalanuvchilar</h1>
        <button class="back-btn" onclick="history.back()">← Назад</button>
    </header>

    <!-- "🟢 Hozir onlayn" statistikasi — Telegramga o'xshagan belgi bilan
         (foydalanuvchi so'rovi, 2026-09-09) — users.js#refreshOnlineStatus
         orqali har 20 soniyada yangilanadi. -->
    <p id="onlineStatsBar" class="online-stats-bar">🟢 Onlayn: — / — foydalanuvchi</p>

    <!-- Foydalanuvchi ma'lumotlarini qo'lda tahrirlash oynasi
         (foydalanuvchi so'rovi, 2026-09-07: "edit ni qo'shish kerak") —
         users.js: openEditModal()/closeEditModal()/submitEditUser(). -->
    <div id="editUserOverlay" class="edit-modal-overlay" hidden>
        <div class="edit-modal-box">
            <h2>✏️ Foydalanuvchini tahrirlash</h2>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <label>Username
                    <input type="text" id="editUsername" required>
                </label>
                <label>Ism
                    <input type="text" id="editFirstName">
                </label>
                <label>Familiya
                    <input type="text" id="editLastName">
                </label>
                <label>Email
                    <input type="email" id="editEmail">
                </label>
                <label>Telefon (masalan 901234567)
                    <input type="text" id="editPhoneNumber">
                </label>
                <label>Ish/o'qish joyi
                    <input type="text" id="editWorkplace">
                </label>
                <label>Lavozim
                    <input type="text" id="editJobTitle">
                </label>
                <label>Telegram ID
                    <input type="text" id="editTelegramId" inputmode="numeric">
                </label>
                <label>Telegram @username
                    <input type="text" id="editTelegramUsername">
                </label>
                <label>Google ID
                    <input type="text" id="editGoogleId">
                </label>
                <label>Facebook ID
                    <input type="text" id="editFacebookId">
                </label>
                <p id="editUserError" class="edit-modal-error" hidden></p>
                <div class="edit-modal-actions">
                    <button type="button" class="edit-modal-cancel" onclick="closeEditModal()">Bekor qilish</button>
                    <button type="submit" class="edit-modal-save">💾 Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <!-- "✉️" ikonkasi orqali — OWNER Telegram bot orqali foydalanuvchiga
         to'g'ridan-to'g'ri shaxsiy xabar yuboradi (foydalanuvchi so'rovi,
         2026-09-09: "USERNAME yoniga bitta ikonka qo'ygin... bot orqali
         unga shaxsiy habar jo'natish mumkin bo'lsin OWNER nomidan"). Faqat
         Telegram ulangan (telegramId bor) foydalanuvchilarda ko'rinadi —
         users.js#renderUsers. -->
    <div id="telegramMessageOverlay" class="edit-modal-overlay" hidden>
        <div class="edit-modal-box">
            <h2>✉️ Telegram orqali shaxsiy xabar</h2>
            <form id="telegramMessageForm">
                <input type="hidden" id="tgMessageUserId">
                <p id="tgMessageUserLabel" class="tg-message-user-label"></p>
                <label>Xabar matni
                    <textarea id="tgMessageText" rows="5" maxlength="2000" required
                              placeholder="Foydalanuvchiga yubormoqchi bo'lgan xabaringizni yozing..."></textarea>
                </label>
                <p id="tgMessageError" class="edit-modal-error" hidden></p>
                <div class="edit-modal-actions">
                    <button type="button" class="edit-modal-cancel" onclick="closeTelegramMessageModal()">Bekor qilish</button>
                    <button type="submit" class="edit-modal-save">📤 Yuborish</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Ustki gorizontal scroll — jadval uzun (ko'p qator) bo'lganda
         pastki scrollbar'gacha aylantirmasdan, tepadan ham gorizontal
         siljitish mumkin bo'lishi uchun (foydalanuvchi so'rovi,
         2026-09-08). Kengligi table-scroll-top-sync.js orqali haqiqiy
         jadval kengligiga moslanadi, ikkalasi bir-biriga sinxronlanadi. -->
    <div class="table-scroll-top" id="usersTableScrollTop">
        <div class="table-scroll-top-inner" id="usersTableScrollTopInner"></div>
    </div>

    <!-- Sarlavhani ekranga QOTIRISH ("zakrepit verx", foydalanuvchi
         so'rovi, 2026-09-09) — position:sticky jadval katakchalarida
         chuqur LAYOUT/PAINT uzilishiga ega ekanligi 3 marta jonli
         tekshiruvda tasdiqlandi (getBoundingClientRect va
         elementFromPoint bir-biriga zid natija berardi). Shu sabab
         ASL <thead> oddiy (static) qoldirilib, UNING nusxasi shu yerda
         position:fixed <div>lar bilan (jadval katakchalari EMAS)
         alohida quriladi — xuddi table-scroll-fixed (pastki scrollbar)
         kabi, allaqachon ishonchli ishlagan andoza. Faqat asl sarlavha
         ekrandan (navbar ostidan) chiqib ketganda ko'rinadi, JS orqali
         (users.js#updateFixedHeaderVisibility). -->
    <div class="table-header-fixed" id="usersTableHeaderFixed" hidden>
        <div class="table-header-fixed-frozen" id="usersTableHeaderFixedFrozen"></div>
        <div class="table-header-fixed-scroll-clip">
            <div class="table-header-fixed-inner" id="usersTableHeaderFixedInner"></div>
        </div>
    </div>

    <div class="table-scroll" id="usersTableScroll">
    <table class="users-table">
        <thead>
        <tr>
            <th class="sticky-col-1">ID</th>
            <th class="sticky-col-2">Avatar</th>
            <th class="sticky-col-3">Username</th>
            <th>Ism Familiya</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Telegram ID</th>
            <th>Telegram @username</th>
            <th>Google ID</th>
            <th>Facebook ID</th>
            <th>Ish/o'qish joyi</th>
            <th>Lavozim</th>
            <th>Role</th>
            <th>ADMIN muddati</th>
            <th>Ro'yxatdan o'tgan</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="usersTableBody">
        <!-- Подгружается через JS -->
        </tbody>
    </table>
    </div>

    <!-- Ekranga QOTIRILGAN (fixed) gorizontal scroll — sahifani pastga
         aylantirganda ham (jadval ko'p qatorli bo'lgani uchun) doim
         ko'rinib turadi, tepadagi/pastdagi scrollbar'gacha qaytadan
         aylantirish shart emas (foydalanuvchi so'rovi, 2026-09-09).
         Kengligi/joylashuvi table-scroll-top-sync.js orqali jadval
         konteyneriga aniq moslanadi, faqat jadval haqiqatan gorizontal
         aylantirilishi kerak bo'lgandagina ko'rinadi. -->
    <div class="table-scroll-fixed" id="usersTableScrollFixed" hidden>
        <div class="table-scroll-top-inner" id="usersTableScrollFixedInner"></div>
    </div>
</div>

</body>

</html>
