<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/users.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <script src="/js/users.js" defer></script>
    <script src="/js/navbar.js" defer></script>
</head>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <header class="top-bar">
        <h1>👥 Foydalanuvchilar</h1>
        <button class="back-btn" onclick="history.back()">← Назад</button>
    </header>

    <!-- Foydalanuvchi ma'lumotlarini qo'lda tahrirlash oynasi
         (foydalanuvchi so'rovi, 2026-09-07: "edit ni qo'shish kerak") —
         users.js: openEditModal()/closeEditModal()/submitEditUser(). -->
    <div id="editUserOverlay" class="edit-modal-overlay" hidden>
        <div class="edit-modal-box">
            <h2>✏️ Foydalanuvchini tahrirlash</h2>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <label>Username
                    <input type="text" id="editUsername" required>
                </label>
                <label>Ism
                    <input type="text" id="editFirstName">
                </label>
                <label>Familiya
                    <input type="text" id="editLastName">
                </label>
                <label>Email
                    <input type="email" id="editEmail">
                </label>
                <label>Telefon (masalan 901234567)
                    <input type="text" id="editPhoneNumber">
                </label>
                <label>Ish/o'qish joyi
                    <input type="text" id="editWorkplace">
                </label>
                <label>Lavozim
                    <input type="text" id="editJobTitle">
                </label>
                <label>Telegram ID
                    <input type="text" id="editTelegramId" inputmode="numeric">
                </label>
                <label>Telegram @username
                    <input type="text" id="editTelegramUsername">
                </label>
                <label>Google ID
                    <input type="text" id="editGoogleId">
                </label>
                <p id="editUserError" class="edit-modal-error" hidden></p>
                <div class="edit-modal-actions">
                    <button type="button" class="edit-modal-cancel" onclick="closeEditModal()">Bekor qilish</button>
                    <button type="submit" class="edit-modal-save">💾 Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-scroll">
    <table class="users-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Ism Familiya</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Telegram ID</th>
            <th>Telegram @username</th>
            <th>Google ID</th>
            <th>Ish/o'qish joyi</th>
            <th>Lavozim</th>
            <th>Role</th>
            <th>ADMIN muddati</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="usersTableBody">
        <!-- Подгружается через JS -->
        </tbody>
    </table>
    </div>
</div>

</body>

</html>
