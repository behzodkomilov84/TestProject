<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Kirish</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="/css/register-login.css">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

</head>
<body>

<div id="success-alert"
     th:if="${successMessage}"
     th:text="${successMessage}"
     class="success-alert">
</div>

<p style="color: red"
   th:if="${LOGIN_ERROR}"
   th:text="${LOGIN_ERROR}"
   class="error-alert"
   id="error-alert"></p>

<div class="container">
    <div class="login form">
        <header>Kirish</header>
        <form action="/login" method="post">
            <input class="username" type="text" name="username" id="username" placeholder="Foydalanuvchi nomini kiriting" autocomplete="username" required>
            <div class="password-box">
            <input class="password" type="password" name="password" id="pwd" placeholder="Parolni kiriting" autocomplete="current-password" required>
            <input class="checkbox" type="checkbox" id="showPsw" onclick="pwd.type=this.checked?'text':'password'">
                <label for="showPsw">Parolni ko'rsatish?</label>
            </div>
            <a href="/forgot-password">Parolni unutdingizmi?</a>
            <input type="submit" class="button" value="Kirish">
        </form>

        <!-- "Telegram orqali kirish" — Telegram'ning tayyor Login Widget'i
             o'rniga o'z tugmamiz + "Telegram.Login.auth(...)" custom oauth
             flow (foydalanuvchi so'rovi, 2026-09-06: "O'zbekcha qil
             knopkani" — tayyor widget matni rus/ingliz tilida, o'zgartirib
             bo'lmaydi). Bot allaqachon @BotFather'da "/setdomain" bilan
             shu saytga ruxsat berilgan bo'lishi kerak. Popup tasdiqlangach
             natija "/telegram-login"ga (TelegramWidgetLoginController)
             xuddi tayyor widget'dagi bilan bir xil formatda yuboriladi. -->
        <div class="social-divider"><span>yoki</span></div>
        <button type="button" class="telegram-login-btn" onclick="telegramLogin()">
            ✈️ Telegram orqali kirish
        </button>
        <script src="https://telegram.org/js/telegram-widget.js?22"></script>
        <script th:inline="javascript">
            const TELEGRAM_BOT_ID = /*[[${telegramBotId}]]*/ "";

            function telegramLogin() {
                if (typeof Telegram === "undefined" || !Telegram.Login) {
                    alert("Telegram widget hali yuklanmadi, birozdan keyin qaytadan urinib ko'ring.");
                    return;
                }
                Telegram.Login.auth(
                    {bot_id: TELEGRAM_BOT_ID, request_access: "write"},
                    function (data) {
                        if (!data) return; // foydalanuvchi bekor qildi
                        window.location.href = "/telegram-login?" + new URLSearchParams(data).toString();
                    }
                );
            }
        </script>

        <div class="signup" id="signup">
            <span class="signup">Hisobingiz yo'qmi?
            <label><a href="/registration">Ro'yxatdan o'tish</a></label></span>
        </div>


    </div>



</div>

<script>
    setTimeout(() => {
        const alert = document.getElementById("success-alert");
        if (alert) {
            alert.style.display = "none";
        }
    }, 5000);

    setTimeout(() => {
        const alert = document.getElementById("error-alert");
        if (alert) {
            alert.style.display = "none";
        }
    }, 5000);
</script>
</body>
</html>
