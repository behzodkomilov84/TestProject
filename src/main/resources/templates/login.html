<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Kirish</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="/css/register-login.css">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

</head>
<body>

<div id="success-alert"
     th:if="${successMessage}"
     th:text="${successMessage}"
     class="success-alert">
</div>

<p style="color: red"
   th:if="${LOGIN_ERROR}"
   th:text="${LOGIN_ERROR}"
   class="error-alert"
   id="error-alert"></p>

<div class="container">
    <div class="login form">
        <header>Kirish</header>
        <form action="/login" method="post">
            <input class="username" type="text" name="username" id="username" placeholder="Foydalanuvchi nomini kiriting" autocomplete="username" required>
            <div class="password-box">
            <input class="password" type="password" name="password" id="pwd" placeholder="Parolni kiriting" autocomplete="current-password" required>
            <input class="checkbox" type="checkbox" id="showPsw" onclick="pwd.type=this.checked?'text':'password'">
                <label for="showPsw">Parolni ko'rsatish?</label>
            </div>
            <a href="/forgot-password">Parolni unutdingizmi?</a>
            <input type="submit" class="button" value="Kirish">
        </form>

        <!-- "Telegram orqali kirish" — Telegram'ning tayyor Login Widget'i
             o'rniga o'z tugmamiz + "Telegram.Login.auth(...)" custom oauth
             flow (foydalanuvchi so'rovi, 2026-09-06: "O'zbekcha qil
             knopkani" — tayyor widget matni rus/ingliz tilida, o'zgartirib
             bo'lmaydi). Bot allaqachon @BotFather'da "/setdomain" bilan
             shu saytga ruxsat berilgan bo'lishi kerak. Popup tasdiqlangach
             natija "/telegram-login"ga (TelegramWidgetLoginController)
             xuddi tayyor widget'dagi bilan bir xil formatda yuboriladi. -->
        <div class="social-divider"><span>yoki</span></div>
        <button type="button" class="telegram-login-btn" onclick="telegramLogin()">
            <svg width="20" height="20" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                <circle cx="120" cy="120" r="120" fill="#29b6f6"/>
                <path fill="#fff" d="M175.3 67.6L54.7 115c-8.3 3.3-8.2 7.8-1.5 9.8l30.8 9.6 71.4-44.9c3.4-2 6.5-.9 3.9 1.3l-57.8 52.2h-.1l2.1 30.9c3 0 4.3-1.4 6-3l14.4-14 30 22.2c5.5 3 9.5 1.5 10.9-5.1l19.7-92.9c2-8.1-3.1-11.7-8.2-9.5z"/>
            </svg>
            Telegram orqali kirish
        </button>
        <script src="https://telegram.org/js/telegram-widget.js?22"></script>
        <script th:inline="javascript">
            const TELEGRAM_BOT_ID = /*[[${telegramBotId}]]*/ "";

            function telegramLogin() {
                if (typeof Telegram === "undefined" || !Telegram.Login) {
                    alert("Telegram widget hali yuklanmadi, birozdan keyin qaytadan urinib ko'ring.");
                    return;
                }
                Telegram.Login.auth(
                    {bot_id: TELEGRAM_BOT_ID, request_access: "write"},
                    function (data) {
                        if (!data) return; // foydalanuvchi bekor qildi
                        window.location.href = "/telegram-login?" + new URLSearchParams(data).toString();
                    }
                );
            }
        </script>

        <!-- "Google orqali kirish" — oddiy sahifa-redirect (Authorization
             Code oqimi, GoogleLoginController), popup shart emas
             (foydalanuvchi so'rovi, 2026-09-06). -->
        <a href="/oauth2/google/authorize" class="google-login-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
            </svg>
            Google orqali kirish
        </a>

        <div class="signup" id="signup">
            <span class="signup">Hisobingiz yo'qmi?
            <label><a href="/registration">Ro'yxatdan o'tish</a></label></span>
        </div>


    </div>



</div>

<script>
    setTimeout(() => {
        const alert = document.getElementById("success-alert");
        if (alert) {
            alert.style.display = "none";
        }
    }, 5000);

    setTimeout(() => {
        const alert = document.getElementById("error-alert");
        if (alert) {
            alert.style.display = "none";
        }
    }, 5000);
</script>
</body>
</html>
