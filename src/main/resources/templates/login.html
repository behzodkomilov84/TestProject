<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>Kirish</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="/css/register-login.css">

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

</head>
<body>

<div id="success-alert"
     th:if="${successMessage}"
     th:text="${successMessage}"
     class="success-alert">
</div>

<p style="color: red"
   th:if="${LOGIN_ERROR}"
   th:text="${LOGIN_ERROR}"
   class="error-alert"
   id="error-alert"></p>

<div class="container">
    <div class="login form">
        <header>Kirish</header>
        <form action="/login" method="post">
            <input class="username" type="text" name="username" id="username" placeholder="Foydalanuvchi nomini kiriting" autocomplete="username" required>
            <div class="password-box">
            <input class="password" type="password" name="password" id="pwd" placeholder="Parolni kiriting" autocomplete="current-password" required>
            <input class="checkbox" type="checkbox" id="showPsw" onclick="pwd.type=this.checked?'text':'password'">
                <label for="showPsw">Parolni ko'rsatish?</label>
            </div>
            <a href="/forgot-password">Parolni unutdingizmi?</a>
            <input type="submit" class="button" value="Kirish">
        </form>

        <!-- "Telegram orqali kirish" — Telegram Login Widget (foydalanuvchi
             so'rovi, 2026-09-06). Bot allaqachon @BotFather'da "/setdomain"
             bilan shu saytga ruxsat berilgan bo'lishi kerak, aks holda
             widget xato ko'rsatadi. Bosilganda Telegram foydalanuvchini
             "data-auth-url"ga (TelegramWidgetLoginController) imzolangan
             ma'lumotlar bilan qaytaradi. -->
        <div class="social-divider"><span>yoki</span></div>
        <div class="telegram-login-box">
            <script async src="https://telegram.org/js/telegram-widget.js?22"
                    th:attr="data-telegram-login=${telegramBotUsername}"
                    data-size="large"
                    data-radius="8"
                    data-auth-url="/telegram-login"
                    data-request-access="write"></script>
        </div>

        <div class="signup" id="signup">
            <span class="signup">Hisobingiz yo'qmi?
            <label><a href="/registration">Ro'yxatdan o'tish</a></label></span>
        </div>


    </div>



</div>

<script>
    setTimeout(() => {
        const alert = document.getElementById("success-alert");
        if (alert) {
            alert.style.display = "none";
        }
    }, 5000);

    setTimeout(() => {
        const alert = document.getElementById("error-alert");
        if (alert) {
            alert.style.display = "none";
        }
    }, 5000);
</script>
</body>
</html>
