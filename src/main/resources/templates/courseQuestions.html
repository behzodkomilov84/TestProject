<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Barcha savollar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/courses.css">
    <link rel="stylesheet" href="/css/courseQuestions.css">

    <script th:inline="javascript">
        const COURSE_ID = /*[[${courseId}]]*/ 0;

    <script src="/js/courseQuestions.js" defer></script>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="courses-container cq-page">

    <input type="text" id="cqSearchInput" class="cq-search-input"

    <p id="cqSummary" class="cq-summary"></p>

    <div id="cqSectionsList" class="cq-sections-list">

    </div>

</html>
