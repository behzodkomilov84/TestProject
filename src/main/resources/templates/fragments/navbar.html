<header th:fragment="navbar" class="navbar"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="nav-logo">🧠 Smart-Test</div>

    <div class="nav-user nav-center">
        <span th:if="${#authorization.expression('isAuthenticated()')}">
            Xush kelibsiz, <b th:text="${#authentication.name}">username</b> </span>
        <!-- Dual-role: foydalanuvchida bir nechta rol bo'lishi mumkin (masalan,
             ham o'qituvchi, ham o'quvchi), shuning uchun barcha rollar vergul
             bilan ko'rsatiladi (avval faqat authorities[0] ko'rsatilardi).
             Spring Security 7 parolli login'dan keyin "FACTOR_PASSWORD" kabi
             o'ziga xos texnik authority ham qo'shib qo'yadi (bu rol emas,
             autentifikatsiya "faktori"), shuning uchun faqat "ROLE_" bilan
             boshlanadigan haqiqiy rollarni filtrlab olamiz. -->
        <span th:if="${#authorization.expression('isAuthenticated()')}"
              th:with="roleNames=${#authentication.authorities.?[authority != null and authority.startsWith('ROLE_')].![authority]}">
            <br style="height: 0px">Rolingiz:
            <b th:text="${#strings.listJoin(roleNames, ', ').replace('ROLE_','')}"
               th:attr="data-role=${#strings.listJoin(roleNames, ',').replace('ROLE_','')}"
               style="color: darkred">
                ROLE </b>
        </span>
    </div> <!-- ☰ burger -->

    <div class="nav-actions">
        <!-- Til tanlash — Google Translate'ga tayanadi, lekin uning o'z
             (katta) select elementi o'rniga faqat kichik 🌐 belgili
             dropdown ko'rsatiladi (bayroqlar bilan: uz/ru/en/tr).
             Burger menyudan tashqarida — mobil holatda ham doim ko'rinadi. -->
        <div class="dropdown lang-switcher">
            <button class="dropbtn lang-btn" type="button" title="Tilni tanlash">🌐</button>
            <div class="dropdown-content lang-dropdown-content">
                <a href="#" onclick="setSiteLanguage('uz'); return false;">🇺🇿 O'zbekcha</a>
                <a href="#" onclick="setSiteLanguage('ru'); return false;">🇷🇺 Русский</a>
                <a href="#" onclick="setSiteLanguage('en'); return false;">🇬🇧 English</a>
                <a href="#" onclick="setSiteLanguage('tr'); return false;">🇹🇷 Türkçe</a>
            </div>
        </div>
        <div id="google_translate_element" style="display:none;"></div>
        <script>
            function googleTranslateElementInit() {
                new google.translate.TranslateElement({
                    pageLanguage: 'uz',
                    includedLanguages: 'uz,ru,en,tr',
                    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                    autoDisplay: false
                }, 'google_translate_element');
            }
        </script>
        <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

        <button class="burger" onclick="toggleMenu()">☰</button>
        <nav id="nav-menu" class="nav-items">
            <a href="/index">Bosh sahifa</a>
            <a href="/history">Statistika</a>
            <!-- Kurslar — "Mavjud kurslar" (hammaga) va "Kursga obuna berish"
                 (faqat OWNER, obuna bilan bog'liq barcha funksiyalar shu
                 alohida sahifada jamlangan) ichki dropdown ichida. -->
            <div class="dropdown" sec:authorize="isAuthenticated()">
                <button class="dropbtn">🎓 Kurslar ▾</button>
                <div class="dropdown-content">
                    <a href="/courses">📚 Mavjud kurslar</a>
                    <a href="/courses/subscriptions" sec:authorize="hasAuthority('ROLE_OWNER')">💳 Kursga obuna berish</a>
                </div>
            </div>

            <!-- Owner/Admin/Student panellari yagona "Panels" dropdown ichida —
                 har biri o'z rollariga qarab (sec:authorize) ko'rinadi. -->
            <div class="dropdown"
                 sec:authorize="hasAnyAuthority('ROLE_OWNER','ROLE_ADMIN','ROLE_USER')">

                <button class="dropbtn">
                    Panels ▾
                </button>

                <div class="dropdown-content">
                    <!-- Owner Panel — ichki (nested) dropdown, bosilganda ochiladi
                         (Admin/Student Panel bilan bir xil andoza). To'lov tarixi
                         ham shu ichida. -->
                    <div class="sub-dropdown" sec:authorize="hasAuthority('ROLE_OWNER')">
                        <button class="dropbtn sub-dropbtn owner-link" type="button">Owner Panel ▾</button>
                        <div class="sub-dropdown-content">
                            <a href="/users">Foydalanuvchilar</a>
                            <a href="/payments">To'lov tarixi</a>
                        </div>
                    </div>

                    <!-- Admin Panel — ichki (nested) dropdown, bosilganda ochiladi -->
                    <div class="sub-dropdown" sec:authorize="hasAnyAuthority('ROLE_OWNER','ROLE_ADMIN')">
                        <button class="dropbtn sub-dropbtn" type="button">Admin Panel ▾</button>
                        <div class="sub-dropdown-content">
                            <a href="/science">Test boshqaruvi</a>
                            <a href="/teacher">Gruppa</a>
                            <a href="/admin-assignment">Topshiriqlar</a>
                        </div>
                    </div>

                    <!-- Student Panel — ichki (nested) dropdown, bosilganda ochiladi -->
                    <div class="sub-dropdown" sec:authorize="hasAnyAuthority('ROLE_OWNER','ROLE_USER')">
                        <button class="dropbtn sub-dropbtn" type="button">Student Panel ▾</button>
                        <div class="sub-dropdown-content">
                            <a href="/student">Группа</a>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Profil, Telegramga ulash va Bildirishnomalar — barchasi
                 yagona "Profil" ochiladigan menyusi ichida, matn bilan. -->
            <div class="dropdown" sec:authorize="isAuthenticated()">
                <button class="dropbtn" title="Profil">👤 Profil</button>
                <div class="dropdown-content">
                    <a href="/profile">👤 Profil</a>
                    <a href="#" onclick="linkTelegram(); return false;">🔗 Telegramga ulash</a>
                    <a href="/notifications">🔔 Bildirishnomalar
                        <span id="notif-badge" class="notif-badge" style="display:none;">0</span>
                    </a>
                    <a href="/logout">Chiqish</a>
                </div>
            </div>
        </nav>
    </div>


</header>
