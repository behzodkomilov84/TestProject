<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Savollar to'plami</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/teacher-pages.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="teacher-page">
    <div class="teacher-page-header">
        <h1>📝 Savollar to'plami</h1>
    </div>

    <nav class="teacher-page-nav">
        <a href="/teacher/groups">👥 Guruhlarim</a>
        <a href="/teacher/builder" class="active">📝 Savollar to'plami</a>
        <a href="/teacher/assign">📤 Topshiriq berish</a>
        <a href="/admin-assignment">📊 Topshiriqlar</a>
    </nav>

    <div class="teacher-card">
        <h2>Yangi to'plam tuzish</h2>

        <label for="scienceSelect">Bo'lim</label>
        <select id="scienceSelect"></select>
    </div>

    <!-- "🎲 Avtomatik tanlash" — Bo'lim tanlangach, shu Bo'limning BARCHA
         Mavzu/Darslari checkbox ko'rinishida chiqadi (default —
         hammasi belgilangan). Jami nechta savol kerakligini kiritib,
         tugma bosilsa — belgilangan darslar orasida HAR BIRIGA TENG
         bo'lib (savollar soniga qarab EMAS) tasodifiy savollar tanlab,
         "Tanlangan savollar" ro'yxatiga qo'shadi. -->
    <div class="teacher-card">
        <h2>🎲 Avtomatik tanlash</h2>
        <div class="teacher-field-row" style="margin-bottom:10px;">
            <button type="button" class="teacher-icon-btn" id="toggleAllTopicsBtn" onclick="toggleAllTopics()">
                ❌ Barchasini bekor qilish
            </button>
        </div>
        <div id="topicTree" class="teacher-question-box">
            <div class="teacher-empty">Avval bo'limni tanlang</div>
        </div>

        <label for="autoSelectCount">Jami nechta savol</label>
        <div class="teacher-field-row">
            <input id="autoSelectCount" type="number" min="1" placeholder="Masalan: 100">
            <button class="teacher-btn-primary" onclick="autoSelectQuestions()">🎲 Avtomatik tanlash</button>
        </div>
    </div>

    <!-- "✋ Bittalab ko'rib tanlash" — bitta Mavzu/Darsni tanlab, uning
         savollarini ko'rib chiqib, xohlaganlarini qo'lda belgilash
         (avtomatik tanlashdan tashqari, qo'shimcha aniqlashtirish uchun). -->
    <div class="teacher-card">
        <h2>✋ Bittalab ko'rib tanlash</h2>

        <label for="sectionSelect">Mavzu</label>
        <select id="sectionSelect"><option value="">--Avval bo'limni tanlang--</option></select>

        <label for="topicSelect">Dars</label>
        <select id="topicSelect"><option value="">--Avval mavzuni tanlang--</option></select>

        <label>Savollar</label>
        <div id="questions" class="teacher-question-box">
            <div class="teacher-empty">Avval bo'lim, mavzu va darsni tanlang</div>
        </div>
    </div>

    <div class="teacher-card">
        <label for="selectedList">Tanlangan savollar (<b id="counter">0</b> ta)</label>
        <div id="selectedList" class="teacher-question-box"></div>

        <label for="setName">To'plam nomi</label>
        <div class="teacher-field-row">
            <input id="setName" type="text" placeholder="Masalan: 1-dars — asosiy testlar">
            <button class="teacher-btn-primary" id="saveSetBtn" onclick="saveSet()">💾 Saqlash</button>
            <button class="teacher-icon-btn" id="cancelEditBtn" onclick="resetBuilder()" style="display:none;">
                ❌ Tahrirlashni bekor qilish
            </button>
        </div>
    </div>

    <div class="teacher-card">
        <h2>Mavjud to'plamlar</h2>
        <div id="setsList"></div>
    </div>
</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/promptModal.js}"></script>
<script th:src="@{/js/teacher-builder.js}"></script>
</body>
</html>
