<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parolni tiklash</title>

    <link rel="stylesheet" href="/css/register-login.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>

<p style="color: red"
   th:if="${forgotPasswordError}"
   th:text="${forgotPasswordError}"
   class="error-alert"
   id="error-alert"></p>

<div class="container">
    <div class="login form">
        <header>Parolni tiklash</header>

        <p style="font-size: 14px; margin-bottom: 15px;">
            Username'ingizni kiriting — tasdiqlash kodi Telegram
            (agar ulangan bo'lsa) yoki email orqali yuboriladi.
        </p>

        <form action="/forgot-password" method="post">
            <input type="text" name="username" placeholder="Username'ingizni kiriting" autocomplete="username" required>
            <input type="submit" class="button" value="Kod yuborish">
        </form>

        <div class="signup">
            <span class="signup"><a href="/login">← Login sahifasiga qaytish</a></span>
        </div>
    </div>
</div>

<script>
    setTimeout(() => {
        const alert = document.getElementById("error-alert");
        if (alert) alert.style.display = "none";
    }, 5000);
</script>
</body>
</html>
