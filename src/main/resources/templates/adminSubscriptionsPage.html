<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin obunalari</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/users.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <script src="/js/adminSubscriptions.js" defer></script>
    <script src="/js/navbar.js" defer></script>
</head>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <header class="top-bar">
        <h1>💳 Admin obunalari</h1>
        <button class="back-btn" onclick="history.back()">← Назад</button>
    </header>

    <!-- To'lov asosida ADMIN (o'qituvchi) huquqini berish paneli -->
    <div class="subscriptions-panel" style="margin-top:0; padding-top:0; border-top:none;">

        <h2>⏳ Tasdiq kutilayotgan to'lovlar</h2>
        <div class="table-scroll">
        <table class="subscriptions-table">
            <thead>
            <tr>
                <th>Foydalanuvchi</th>
                <th>Summa</th>
                <th>Manba</th>
                <th>So'rov sanasi</th>
                <th>Amallar</th>
            </tr>
            </thead>
            <tbody id="pendingTableBody">
                <tr><td colspan="5" class="empty-row">Kutilayotgan so'rov yo'q</td></tr>
            </tbody>
        </table>
        </div>

        <h2>➕ To'lovni qo'lda qayd qilib, ADMIN berish</h2>
        <div class="manual-subscription-form">
            <select id="manualUserSelect"></select>
            <input type="number" id="manualAmount" placeholder="Summa (so'm)" min="1">
            <input type="number" id="manualDuration" placeholder="Necha oy" value="1" min="1">
            <input type="text" id="manualNote" placeholder="Izoh (ixtiyoriy)">
            <button onclick="createManualSubscription()">✅ Tasdiqlash va ADMIN berish</button>
        </div>

        <!-- Click'ning minimal tranzaksiya summasi — .env/redeploy'siz
             shu yerdan o'zgartiriladi (PaymentOrderService.createOrder shu
             chegaradan kam summali buyurtmani rad etadi). -->
        <h2>⚙️ To'lov sozlamalari</h2>
        <div class="manual-subscription-form">
            <input type="number" id="minAmountInput" placeholder="Minimal summa (so'm)" min="1">
            <button onclick="saveMinAmount()">💾 Saqlash</button>
        </div>
    </div>
</div>

</body>

</html>
