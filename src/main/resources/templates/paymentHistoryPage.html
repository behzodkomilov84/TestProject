<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>To'lov tarixi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/users.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/payments.css">

    <script src="/js/payments.js" defer></script>
    <script src="/js/navbar.js" defer></script>
</head>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <header class="top-bar">
        <h1>💰 To'lov tarixi va hisobot</h1>
        <div style="display:flex; gap:8px;">
            <button onclick="emailReport()">📧 Hisobotni emailga yuborish</button>
            <button class="back-btn" onclick="history.back()">← Назад</button>
        </div>
    </header>

    <!-- Umumiy ko'rsatkichlar (KPI). "Tasdiq kutmoqda" olib tashlandi
         (foydalanuvchi so'rovi, 2026-09-12: "Endi bunday logika yo'qku") —
         qo'lda tasdiqlanadigan PENDING to'lov so'rovi mexanizmi butunlay
         olib tashlangan edi (faqat Click orqali onlayn to'lov qoldi),
         shu sabab bu katakcha endi hech qachon mazmunli son ko'rsatmaydi. -->
    <div class="stat-cards">
        <div class="stat-card">
            <div class="stat-label">Jami tushum</div>
            <div class="stat-value" id="statTotalRevenue">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Shu oy</div>
            <div class="stat-value" id="statThisMonth">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Faol obunachilar</div>
            <div class="stat-value" id="statActiveSubscribers">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Jami to'lovlar</div>
            <div class="stat-value" id="statTotalCount">—</div>
        </div>
    </div>

    <!-- Oylik dinamika -->
    <div class="subscriptions-panel">
        <h2>📈 Oylar bo'yicha tushum</h2>
        <div class="table-scroll">
        <table class="subscriptions-table">
            <thead>
            <tr>
                <th>Oy</th>
                <th>Tushum</th>
                <th>To'lovlar soni</th>
            </tr>
            </thead>
            <tbody id="monthlyTableBody">
                <tr><td colspan="3" class="empty-row">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
        </div>
    </div>

    <!-- To'liq to'lov tarixi -->
    <div class="subscriptions-panel">
        <h2>📋 To'liq to'lov tarixi</h2>

        <!-- Sarlavhani ekranga qotirish ("zakrepit verx", foydalanuvchi
             so'rovi, 2026-09-16) — /users sahifasidagi bilan bir xil
             ISHONCHLI andoza: ASL <thead> oddiy (static) qoldirilib,
             uning nusxasi shu yerda position:fixed <div>lar bilan
             (jadval katakchalari EMAS) alohida quriladi (users.css'da
             2026-09-09 topilgan Chromium bug — sticky-top jadval
             katakchalarida ishlatilganda LAYOUT/PAINT uzilishiga olib
             kelgani sabab). Faqat asl sarlavha ekrandan (navbar ostidan)
             chiqib ketganda ko'rinadi (payments.js#updateHistoryFixedHeaderVisibility). -->
        <div class="table-header-fixed" id="historyTableHeaderFixed" hidden>
            <div class="table-header-fixed-frozen" id="historyTableHeaderFixedFrozen"></div>
            <div class="table-header-fixed-scroll-clip">
                <div class="table-header-fixed-inner" id="historyTableHeaderFixedInner"></div>
            </div>
        </div>

        <div class="table-scroll" id="historyTableScroll">
        <table class="subscriptions-table" id="historyTable">
            <thead>
            <tr>
                <th data-sort="username" onclick="onHistorySortHeaderClick('username')">Foydalanuvchi <span class="sort-arrow" id="historySortArrow-username"></span></th>
                <!-- "Xizmat" — ADMIN huquqimi yoki qaysi KURS uchun to'lov
                     (foydalanuvchi so'rovi, 2026-09-09: "/payments
                     ma'lumotlari noto'g'ri" — sabab: bu sahifa avval FAQAT
                     ADMIN-rol obunalarini hisoblardi, kurs to'lovlari
                     butunlay tushib qolgan edi). -->
                <th data-sort="service" onclick="onHistorySortHeaderClick('service')">Xizmat <span class="sort-arrow" id="historySortArrow-service"></span></th>
                <th data-sort="amount" onclick="onHistorySortHeaderClick('amount')">Summa <span class="sort-arrow" id="historySortArrow-amount"></span></th>
                <th data-sort="source" onclick="onHistorySortHeaderClick('source')">Manba <span class="sort-arrow" id="historySortArrow-source"></span></th>
                <th data-sort="status" onclick="onHistorySortHeaderClick('status')">Holat <span class="sort-arrow" id="historySortArrow-status"></span></th>
                <th data-sort="createdAt" onclick="onHistorySortHeaderClick('createdAt')">Sana <span class="sort-arrow" id="historySortArrow-createdAt"></span></th>
                <th data-sort="endDate" onclick="onHistorySortHeaderClick('endDate')">Muddat <span class="sort-arrow" id="historySortArrow-endDate"></span></th>
                <th data-sort="note" onclick="onHistorySortHeaderClick('note')">Izoh <span class="sort-arrow" id="historySortArrow-note"></span></th>
                <th>Amal</th>
            </tr>
            </thead>
            <tbody id="historyTableBody">
                <tr><td colspan="9" class="empty-row">Yuklanmoqda...</td></tr>
            </tbody>
        </table>
        </div>
    </div>
</div>

</body>
</html>
