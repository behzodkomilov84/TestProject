<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Dars</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/courses.css">
    <link rel="stylesheet" href="/css/topic-explanation-search.css">
    <link rel="stylesheet" href="/css/periodicTable.css">

    <script th:inline="javascript">
        const COURSE_ID = /*[[${courseId}]]*/ 0;
        const SECTION_ID = /*[[${sectionId}]]*/ 0;
    </script>
    <!-- YouTube IFrame Player API — video oxirigacha ko'rilganini aniqlash uchun -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/js/periodicTable.js" defer></script>
    <script src="/js/courseSectionView.js" defer></script>
    <script src="/js/navbar.js" defer></script>
</head>

<body th:attr="data-role=${role}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="courses-container">
    <header class="courses-top-bar">
        <h1 id="sectionTitle">Yuklanmoqda...</h1>
        <div class="courses-top-bar-actions">
            <!-- 📕 — faqat 7-sinf kimyo kursida (COURSE_ID=11). 🧬 — 11 va
                 2-kurslarda. Boshqa kurslarda bu tugmalar o'rinsiz bo'lardi,
                 shu sabab kurs ID'iga qarab shartli ko'rsatiladi (ko'rinishi
                 courseSectionView.js#toggleChemistryTools orqali
                 boshqariladi, foydalanuvchi so'rovi, 2026-09-20). -->
            <a class="chemistry-tool-btn hidden" id="chemistryTextbookBtn" href="/docs/kimyo_7_uzb.pdf" target="_blank" title="7-sinf kimyo darsligini PDF holida ochish/yuklab olish">📕 Darslik (PDF)</a>
            <button class="chemistry-tool-btn hidden" id="periodicTableBtn" onclick="openPeriodicTable()" title="Mendeleyev davriy jadvalini ochish">🧬 Mendeleyev jadvali</button>
            <button class="edit-section-btn hidden" id="editSectionBtn" title="Darsni tahrirlash">✏️ Tahrirlash</button>
            <button class="back-btn" id="backToCourseBtn">← Kursga qaytish</button>
        </div>
    </header>

    <!-- Faqat shu sahifaga qidiruv natijasidan kelingan bo'lsa ko'rinadi
         (setupSearchNav, courseSectionView.js) — qidiruvni qayta bermasdan
         keyingi/oldingi topilgan darsga o'tish uchun. -->
    <div id="searchNavBar" class="search-nav-bar hidden">
        <button id="searchNavBackBtn">🔍 Natijalarga qaytish</button>
        <span id="searchNavPosition" class="search-nav-position"></span>
        <button id="searchNavPrevBtn">◀ Oldingi natija</button>
        <button id="searchNavNextBtn">Keyingi natija ▶</button>
    </div>

    <div id="sectionContent" class="section-content"></div>

    <!-- Faqat aynan bitta darsga bog'langan darslarda ko'rinadi
         (kursSection.linkedTopicId mavjud bo'lsa) — JS orqali to'ldiriladi. -->
    <div id="topicTestLink" class="topic-test-link"></div>

    <div class="section-nav-actions">
        <button id="prevSectionBtn" class="prev-section-btn" disabled>← Oldingi dars</button>
        <button id="nextSectionBtn" disabled>Keyingi dars →</button>
        <span id="nextHint" class="next-hint"></span>
    </div>
</div>

<!-- 🧬 "Mendeleyev jadvali" oynasi — periodicTable.js orqali to'ldiriladi
     va boshqariladi (openPeriodicTable/closePeriodicTable). Faqat
     "chemistryTools" ko'rinadigan kurslarda ochish tugmasi mavjud. -->
<div id="periodicTableModal" class="modal-overlay">
    <div id="periodicTableCard">
        <div class="pt-header">
            <h2>🧬 Mendeleyev davriy jadvali</h2>
            <button class="pt-close-btn" onclick="closePeriodicTable()" title="Yopish">✖</button>
        </div>
        <p class="pt-hint">Har bir elementga sichqonni olib boring (yoki mobil qurilmada bosing) — uning xarakteristikasi chiqadi.</p>
        <div id="periodicTableGrid"></div>
        <div id="periodicTooltip"></div>
        <div class="pt-legend">
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-alkali-metal"></span>Ishqoriy metall</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-alkaline-earth"></span>Ishqoriy-yer metall</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-transition-metal"></span>O'tish metali</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-lanthanide"></span>Lantanoid</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-actinide"></span>Aktinoid</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-post-transition"></span>O'tishdan keyingi metall</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-metalloid"></span>Metalloid</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-nonmetal"></span>Metallmas</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-halogen"></span>Galogen</span>
            <span class="pt-legend-item"><span class="pt-legend-swatch pt-cat-noble-gas"></span>Inert gaz</span>
        </div>
    </div>
</div>

</body>
</html>
