<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Основные метатеги -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO и описание страницы -->
    <meta name="description" content="Описание страницы">
    <meta name="author" content="Автор">

    <!-- Заголовок страницы -->
    <title>testConfigPage</title>

    <!-- Подключение CSS, JS -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/testConfigPage.css">

    <script src="/js/navbar.js" defer></script>
    <script src="/js/testConfigPage.js" defer></script>

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- Faqat kurs darsidagi "🎯 Darsga oid testlarni yechish"
         tugmasidan kelinganda ko'rinadi (URL'da courseId bo'lsa) — testni
         boshlamasdan, brauzer "orqaga"siga tayanmasdan kursga qaytish
         uchun (testConfigPage.js#DOMContentLoaded). Boshqa hollarda
         (masalan bosh menyudan to'g'ridan-to'g'ri kirilganda) butunlay
         yashirin qoladi. -->
    <button id="backToCourseBtn" class="back-to-course-btn hidden">🔙 Darsga qaytish</button>

    <h2>Bilimingizni sinab ko'ring</h2>

    <!-- To'rt darajali (Yo'nalish -> Bo'lim -> Mavzu -> Dars) checkbox
         daraxti — BITTA so'rovda (/api/tests/hierarchy) yuklanadi va shu
         yerda to'liq qurib chiqiladi (testConfigPage.js#renderHierarchy).
         Foydalanuvchi so'rovi, 2026-09-07: "танловлар йўналиш, бўлим,
         мавзу, дарс иерарҳиясида бўлсин ... барчасида танлов checkbox
         ли бўлсин. По умолчанию барчаси белгиланган бўлсин." -->
    <div class="section" id="hierarchySection">
        <div class="section-title-row">
            <div class="section-title">Yo'nalish / Bo'lim / Mavzu / Darslarni tanlang</div>
            <button type="button" id="toggleAllBtn" class="toggle-all-btn" onclick="toggleAll()">
                ☑️ Barchasini belgilash
            </button>
        </div>
        <div id="hierarchyTree" class="hierarchy-tree">
            <div class="hierarchy-loading">Yuklanmoqda...</div>
        </div>
    </div>

    <div class="section">
        Mavjud testlar soni: <b><span id="max">0</span></b>
        <input type="number" id="limit" min="1" placeholder="--Test sonini kiriting--">
        <!-- Avval "limit" avtomatik max qiymat bilan to'ldirilardi
             (foydalanuvchi buni "o'zgartirib bo'lmaydigan sonmi" deb
             o'ylab, keyin qiynalib topgan — foydalanuvchi so'rovi,
             2026-09-07: "По умолчанию (10) ни олиб ташлаб тагига
             подсказкага ... каби сўз ёз"). Endi bo'sh boshlanadi, o'rniga
             shu izoh ko'rsatiladi. -->
        <div class="input-hint">Testda qatnashadigan savollar sonini kiriting</div>
        <div id="limitError" class="error-text"></div>
    </div>

    <div class="section" id="timeSection">
        Umumiy vaqt (minut)
        <!-- Avval "value=10" bilan boshlanardi (limit input'dagi bilan
             bir xil chalg'ituvchi muammo) — foydalanuvchi so'rovi,
             2026-09-07: "вақтни ҳам по умолчанию 10 ни олиб ташла.
             Placeholder tursin". -->
        <input type="number" id="time" min="1" placeholder="--Vaqtni kiriting (minutlarda)--">
    </div>

    <button onclick="startTest()">Testni boshlash</button>

    <div id="timer"></div>
    <div id="test"></div>
</div>



</body>
</html>
