<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Guruhlarim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/teacher-pages.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="teacher-page">
    <div class="teacher-page-header">
        <h1>👥 Guruhlarim</h1>
    </div>

    <nav class="teacher-page-nav">
        <a href="/teacher/groups" class="active">👥 Guruhlarim</a>
        <a href="/teacher/builder">📝 Savollar to'plami</a>
        <a href="/teacher/assign">📤 Topshiriq berish</a>
        <a href="/admin-assignment">📊 Topshiriqlar</a>
    </nav>

    <div class="teacher-card">
        <h2>Yangi guruh</h2>
        <div class="teacher-field-row">
            <input id="groupName" type="text" placeholder="Guruh nomini kiriting...">
            <button class="teacher-btn-primary" onclick="createGroup()">➕ Yaratish</button>
        </div>
    </div>

    <div class="teacher-card">
        <h2>Guruhlar ro'yxati</h2>
        <div id="groupList"></div>
    </div>
</div>

<!-- O'quvchi taklif qilish oynasi -->
<div class="modal fade" id="inviteModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5>O'quvchini guruhga taklif qilish</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Ism</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="inviteTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/teacher-groups.js}"></script>
</body>
</html>
