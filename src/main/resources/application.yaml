spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/test_project?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      auto-commit: false
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50 #n+1 xatoliklarni oldini oladi
    open-in-view: false #Har bir proyektni boshlaganda shuni qo'shish kerak
  liquibase:
    change-log: classpath:db/changelog/master.xml
  servlet:
    multipart:
      # Video izohlar ham qo'llab-quvvatlanadi (50MB gacha), shu sabab limit oshirildi.
      max-file-size: 50MB
      max-request-size: 55MB
  # Parolni tiklash — email kanali uchun SMTP sozlamalari. Standart qiymat
  # Brevo (smtp-relay.brevo.com) — Gmail'dan farqli o'laroq, 2FA/App Password
  # bilan ovora bo'lish shart emas, ro'yxatdan o'tib SMTP key olish kifoya
  # (https://app.brevo.com -> SMTP & API -> SMTP). Haqiqiy qiymatlar .env
  # orqali beriladi. Telegram ustuvor kanal bo'lgani uchun, bu bo'sh qolsa
  # ham ilova ishga tushaveradi — faqat emaili bor va telegrami ulanmagan
  # userlar uchun kod yuborilmaydi.
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
#  jackson:
#    deserialization:
#      accept-float-as-int: false #2-usuli ObjectMapperConfig.java da keltirilgan. POST-Zaprosda int'ni o'rniga float kirgizilsa 400-Bad request qaytaradi.
# Markazlashtirilgan xato kuzatuvi (Sentry) — logback-spring.xml'dagi
# SentryAppender shu qiymatlarni o'qiydi (springProperty orqali). SENTRY_DSN
# bo'sh bo'lsa (masalan lokal/dev muhitda), appender hech narsa yubormasdan
# jim o'zini o'chiradi — hech qanday xatolik bermaydi.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}

logging:
  level:
    root: INFO
    org.springframework.security: INFO #Keyinchalik INFO yoki DEBUG ga o'tkazish kk. TRACE otladka uchun faqat. Log juda ko'payib ketadi.
    # NotificationService'dagi @Lazy TelegramBot proksisi (circular dependency'ni
    # uzish uchun) CGLIB orqali yaratiladi — TelegramBot final metodlarga ega
    # (masalan execute(SendPhoto), downloadFile) bo'lgani uchun CGLIB ularni
    # proksilay olmasligi haqida har safar ishga tushganda ko'p sonli WARN
    # chiqaradi. Bu zararsiz (biz faqat final BO'LMAGAN execute(SendMessage)/
    # execute(EditMessageText)'ni chaqiramiz) — shuning uchun jim qildirilgan.
    org.springframework.aop.framework.CglibAopProxy: ERROR
    # Telegram uzun-polling o'qish oqimi (DefaultBotSession$ReaderThread) —
    # internet/Telegram server bilan aloqa vaqtincha uzilsa, shu klass ERROR
    # darajasida stack-trace yozadi, lekin o'zi keyingi tsiklda avtomatik
    # qayta urinishda davom etadi (bot "o'lib qolmaydi"). Tarmoq beqarorligida
    # bu bir necha soniyada bir marta takrorlanib, log'ni to'ldirib yuborardi —
    # shuning uchun jim qilindi (haqiqiy nosozlik — masalan noto'g'ri token —
    # boshqa, alohida xato sifatida ilova ishga tushganda ko'rinadi).
    org.telegram.telegrambots.updatesreceivers.DefaultBotSession: OFF
server.servlet.session.cookie.max-age: -1 # -1 означает: cookie живёт только пока открыт браузер. После закрытия вкладки — cookie исчезает → пользователь разлогинен.
server.servlet.session.timeout: 30m
server:
  tomcat:
    secure-random-algorithm=NativePRNGNonBlocking
  # Nginx kabi reverse proxy orqasida ishlaganda X-Forwarded-* header'larni
  # to'g'ri o'qishi uchun (https/http'ni to'g'ri aniqlash — shunga qarab
  # redirect URL'lar va "Secure" cookie to'g'ri ishlaydi). Standart "none" —
  # local dev'da hech narsani o'zgartirmaydi; production'da
  # docker-compose.prod.yml "framework"ga o'rnatadi.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME:study_grow_bot}
app:
  # Ilovaning o'z ommaviy (tashqi) manzili — botdagi havolalar
  # (masalan avtomatik login) shu bazaga qo'shib quriladi. Ilova o'zi
  # nginx orqasida ishlagani uchun o'z domenini bilmaydi.
  public-base-url: ${APP_PUBLIC_BASE_URL:https://study-grow.uz}
  upload:
    # Yuklangan rasmlar (savol/javob uchun geometrik chizmalar va h.k.) shu
    # papkaga saqlanadi. Jar ichida emas — jar tashqarisida, doimiy joyda
    # turishi kerak (deploy/restart'da yo'qolib qolmasligi uchun).
    dir: ${UPLOAD_DIR:uploads}
    clamav:
      # Standart — o'chirilgan (masalan IntelliJ'dan Docker'siz ishga
      # tushirilganda, clamd konteyneri yo'q). Docker orqali (dev ham,
      # prod ham) "true"ga o'rnatiladi — docker-compose*.yml'ga qarang.
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:clamav}
      port: ${CLAMAV_PORT:3310}
  mail:
    # Parolni tiklash kodini yuboruvchi email manzili.
    from: ${MAIL_FROM:no-reply@smart-test.local}
  payments:
    # ROLE_ADMIN obunasini o'zi (OWNER ishtirokisiz) onlayn sotib olish uchun
    # bir oylik narx (so'm). Hozircha yagona, hammaga bir xil narx.
    price-per-month-som: ${PAYMENT_PRICE_PER_MONTH_SOM:50000}
    click:
      # merchant.click.uz'da ro'yxatdan o'tgach beriladi.
      service-id: ${CLICK_SERVICE_ID:}
      merchant-id: ${CLICK_MERCHANT_ID:}
      secret-key: ${CLICK_SECRET_KEY:}
      pay-base-url: ${CLICK_PAY_BASE_URL:https://my.click.uz/services/pay}
