spring:
  datasource:
    # "&rewriteBatchedStatements=true" — HAQIQIY TOPILGAN BUG (2026-09-12:
    # "Takroriy havolalarni tozalash"ni bossam, xatolik deyapti" — pastdagi
    # hibernate.jdbc.batch_size uni QOG'OZDA guruhlaydi, lekin MySQL
    # Connector/J shu bayrog'isiz baribir HAR BIR yozuvni ALOHIDA tarmoq
    # so'rovi sifatida yuboradi — katta kursda (minglab savol) shu sabab
    # so'rov nginx/brauzer timeout'idan oshib, "xatolik" ko'rinardi.
    url: ${DB_URL:jdbc:mysql://localhost:3306/test_project?createDatabaseIfNotExist=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      auto-commit: false
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50 #n+1 xatoliklarni oldini oladi
        # Yuqoridagi "rewriteBatchedStatements=true" bilan BIRGA ishlaydi —
        # bittalab emas, guruh-guruh (50 tadan) INSERT/UPDATE yuborish
        # uchun. "order_updates/order_inserts" — bir xil jadvalga tegishli
        # yozuvlar ketma-ket kelishini kafolatlaydi, aks holda boshqa
        # jadval bilan "aralashib" ketsa, Hibernate guruhlashni to'xtatadi.
        jdbc.batch_size: 50
        order_updates: true
        order_inserts: true
    open-in-view: false #Har bir proyektni boshlaganda shuni qo'shish kerak
  liquibase:
    change-log: classpath:db/changelog/master.xml
  servlet:
    multipart:
      # 2026-09-10'da oshirildi (HAQIQIY TOPILGAN BUG: "Failed to parse
      # multipart servlet request" — "📥 Darslar + testlarni import
      # qilish" bir martada bir nechta .docx'ni (mammoth.js orqali
      # rasmlari BASE64 sifatida ko'milgan HTML'ga aylantirilib) BITTA
      # JSON qismida yuboradi — 10 ta rasmli dars bilan ham eski 50MB
      # (bitta qism uchun) / 55MB (umumiy) chegaradan osongina oshib
      # ketardi, dizayn maqsadi esa 200 ta faylgacha). "max-file-size" —
      # BITTA multipart qismi uchun (video, yoki barcha darslarning HTML
      # matni birlashgan "items" JSON qismi); "max-request-size" — butun
      # so'rov uchun (barcha .xlsx fayllar + "items" birga).
      max-file-size: 200MB
      max-request-size: 300MB
  # Parolni tiklash — email kanali uchun SMTP sozlamalari. Standart qiymat
  # Brevo (smtp-relay.brevo.com) — Gmail'dan farqli o'laroq, 2FA/App Password
  # bilan ovora bo'lish shart emas, ro'yxatdan o'tib SMTP key olish kifoya
  # (https://app.brevo.com -> SMTP & API -> SMTP). Haqiqiy qiymatlar .env
  # orqali beriladi. Telegram ustuvor kanal bo'lgani uchun, bu bo'sh qolsa
  # ham ilova ishga tushaveradi — faqat emaili bor va telegrami ulanmagan
  # userlar uchun kod yuborilmaydi.
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
#  jackson:
#    deserialization:
#      accept-float-as-int: false #2-usuli ObjectMapperConfig.java da keltirilgan. POST-Zaprosda int'ni o'rniga float kirgizilsa 400-Bad request qaytaradi.
# Markazlashtirilgan xato kuzatuvi (Sentry) — logback-spring.xml'dagi
# SentryAppender shu qiymatlarni o'qiydi (springProperty orqali). SENTRY_DSN
# bo'sh bo'lsa (masalan lokal/dev muhitda), appender hech narsa yubormasdan
# jim o'zini o'chiradi — hech qanday xatolik bermaydi.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}

logging:
  level:
    root: INFO
    org.springframework.security: INFO #Keyinchalik INFO yoki DEBUG ga o'tkazish kk. TRACE otladka uchun faqat. Log juda ko'payib ketadi.
    # NotificationService'dagi @Lazy TelegramBot proksisi (circular dependency'ni
    # uzish uchun) CGLIB orqali yaratiladi — TelegramBot final metodlarga ega
    # (masalan execute(SendPhoto), downloadFile) bo'lgani uchun CGLIB ularni
    # proksilay olmasligi haqida har safar ishga tushganda ko'p sonli WARN
    # chiqaradi. Bu zararsiz (biz faqat final BO'LMAGAN execute(SendMessage)/
    # execute(EditMessageText)'ni chaqiramiz) — shuning uchun jim qildirilgan.
    org.springframework.aop.framework.CglibAopProxy: ERROR
    # Telegram uzun-polling o'qish oqimi (DefaultBotSession$ReaderThread) —
    # internet/Telegram server bilan aloqa vaqtincha uzilsa, shu klass ERROR
    # darajasida stack-trace yozadi, lekin o'zi keyingi tsiklda avtomatik
    # qayta urinishda davom etadi (bot "o'lib qolmaydi"). Tarmoq beqarorligida
    # bu bir necha soniyada bir marta takrorlanib, log'ni to'ldirib yuborardi —
    # shuning uchun jim qilindi (haqiqiy nosozlik — masalan noto'g'ri token —
    # boshqa, alohida xato sifatida ilova ishga tushganda ko'rinadi).
    org.telegram.telegrambots.updatesreceivers.DefaultBotSession: OFF
server.servlet.session.cookie.max-age: -1 # -1 означает: cookie живёт только пока открыт браузер. После закрытия вкладки — cookie исчезает → пользователь разлогинен.
server.servlet.session.timeout: 30m
server:
  tomcat:
    # DIQQAT: bu qator ilgari "secure-random-algorithm=NativePRNGNonBlocking"
    # (teng belgisi bilan, ":" EMAS) deb yozilgan edi — bu YAML kalit-
    # qiymat jufti EMAS, balki "tomcat"ning o'zi uchun bitta oddiy SATR
    # (scalar) qiymat sifatida tasodifan "ishlayotgandek" ko'rinardi (xato
    # bermasdi, lekin Spring buni HECH QANDAY haqiqiy sozlama sifatida
    # tanimasdi — o'lik/ishlamaydigan qator edi). Shu qatorning ostiga
    # (max-http-form-post-size) haqiqiy ikkinchi sozlama qo'shilganda
    # SnakeYAML "tomcat" bir vaqtning o'zida ham satr, ham xarita (mapping)
    # bo'lolmasligini aniqlab, butun faylni parse qila olmay qoldi
    # (production'da ilova umuman ishga tushmay qolardi — HAQIQIY
    # TOPILGAN, jiddiy bug). To'g'ri YAML formatga ":" bilan tuzatildi.
    secure-random-algorithm: NativePRNGNonBlocking
    # HAQIQIY TOPILGAN BUG (2026-09-10): "spring.servlet.multipart.max-
    # request-size" (yuqorida) va nginx'dagi "client_max_body_size"ni
    # 200/300MB'ga oshirganimizdan KEYIN HAM "📥 Darslar + testlarni
    # import qilish" (bir nechta .xlsx fayl, masalan 10 ta) hamon xom
    # "Failed to parse multipart servlet request" xatosini berardi —
    # sabab BUTUNLAY BOSHQA, UCHINCHI chegara ekan: Tomcat connector'ining
    # o'z "max-http-form-post-size"i (Spring Boot standart qiymati — bor-
    # yo'g'i 2MB!), bu Spring multipart resolveri ishga tushishidan
    # OLDIN, servlet darajasida so'rov tanasini o'qishni butunlay
    # to'xtatadi. Shu sabab qolgan ikkitasi bilan BIR XIL qiymatga
    # (300MB) oshirilishi shart.
    max-http-form-post-size: 300MB
  # Nginx kabi reverse proxy orqasida ishlaganda X-Forwarded-* header'larni
  # to'g'ri o'qishi uchun (https/http'ni to'g'ri aniqlash — shunga qarab
  # redirect URL'lar va "Secure" cookie to'g'ri ishlaydi). Standart "none" —
  # local dev'da hech narsani o'zgartirmaydi; production'da
  # docker-compose.prod.yml "framework"ga o'rnatadi.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME:study_grow_bot}
# "Google orqali kirish" — foydalanuvchi so'rovi, 2026-09-06. Google Cloud
# Console'da yaratilgan OAuth 2.0 Client ID/Secret (bo'sh bo'lsa — tugma
# ko'rinadi, lekin bosilganda "sozlanmagan" xabari chiqadi, ClickService
# bilan bir xil "vaqtincha o'chiq" siyosati).
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
# "Facebook orqali kirish" — google bilan bir xil g'oya (foydalanuvchi
# so'rovi, 2026-09-07). Meta for Developers'da yaratilgan App ID/Secret.
facebook:
  app-id: ${FACEBOOK_APP_ID:}
  app-secret: ${FACEBOOK_APP_SECRET:}
app:
  # Ilovaning o'z ommaviy (tashqi) manzili — botdagi havolalar
  # (masalan avtomatik login) shu bazaga qo'shib quriladi. Ilova o'zi
  # nginx orqasida ishlagani uchun o'z domenini bilmaydi.
  public-base-url: ${APP_PUBLIC_BASE_URL:https://study-grow.uz}
  # Saytning haqiqiy egasi (Behzod Komilov, users.id=1) — foydalanuvchi
  # so'rovi, 2026-09-08: "Behzod Komilov'ning rolini hech qanday holatda
  # ham boshqasi o'zgartira olmasin ... Nomi o'zgarsa ham, foydalanuvchini
  # eslab qolsin". ID orqali (username/ism-familiya EMAS) — chunki
  # ikkalasi ham keyinchalik o'zgartirilishi mumkin (ProfileService),
  # faqat baza ID'si o'zgarmas. UserServiceImpl#addRole/removeRole shu
  # ID'ga tegishli hisobning rolini HECH KIM (o'zi ham) o'zgartira
  # olmasligini ta'minlaydi.
  protected-owner-user-id: ${APP_PROTECTED_OWNER_USER_ID:1}
  # "📦 Backup orqali tiklash" paneli (BackupRestoreService) shu papkadan
  # *.sql.gz fayllarni qidiradi — bo'sh bo'lsa (lokal dev'da odatiy holat),
  # funksiya "0 ta backup" deb jim ko'rsatadi, xato bermaydi. Production'da
  # docker-compose.prod.yml orqali /app/backups'ga o'rnatiladi (host'dagi
  # ./backups papkasi, backup.sh yozadigan joyning O'ZI, faqat READ-ONLY).
  backups-dir: ${BACKUPS_DIR:}
  upload:
    # Yuklangan rasmlar (savol/javob uchun geometrik chizmalar va h.k.) shu
    # papkaga saqlanadi. Jar ichida emas — jar tashqarisida, doimiy joyda
    # turishi kerak (deploy/restart'da yo'qolib qolmasligi uchun).
    dir: ${UPLOAD_DIR:uploads}
    clamav:
      # Standart — o'chirilgan (masalan IntelliJ'dan Docker'siz ishga
      # tushirilganda, clamd konteyneri yo'q). Docker orqali (dev ham,
      # prod ham) "true"ga o'rnatiladi — docker-compose*.yml'ga qarang.
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:clamav}
      port: ${CLAMAV_PORT:3310}
  mail:
    # Parolni tiklash kodini yuboruvchi email manzili.
    from: ${MAIL_FROM:no-reply@smart-test.local}
  payments:
    # ROLE_ADMIN obunasini o'zi (OWNER ishtirokisiz) onlayn sotib olish uchun
    # bir oylik narx (so'm). Hozircha yagona, hammaga bir xil narx.
    price-per-month-som: ${PAYMENT_PRICE_PER_MONTH_SOM:50000}
    click:
      # merchant.click.uz'da ro'yxatdan o'tgach beriladi.
      service-id: ${CLICK_SERVICE_ID:}
      merchant-id: ${CLICK_MERCHANT_ID:}
      secret-key: ${CLICK_SECRET_KEY:}
      pay-base-url: ${CLICK_PAY_BASE_URL:https://my.click.uz/services/pay}
